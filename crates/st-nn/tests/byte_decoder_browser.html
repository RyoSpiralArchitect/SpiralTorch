<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident byte decoder training</title>
<h1>Resident byte decoder training</h1>
<p id="summary">Running the frozen Rust/WebGPU checks...</p>
<a id="download" hidden>Download verification result</a>
<pre id="result" data-status="running">Checking the complete byte model...</pre>
<script type="module">
const result = document.querySelector("#result");
try {
  const {default: init, run_resident_byte_decoder_checks} = await import("/target/resident-byte-decoder-web/resident_byte_decoder_browser.js");
  await init();
  const report = JSON.parse(await run_resident_byte_decoder_checks());
  const counts = [18, 31, 23, 37];
  const biasCounts = [0, 4, 0, 4];
  const finite = value => Number.isFinite(value) && value >= 0;
  if (report.schema !== "spiraltorch.resident_byte_decoder.validation.v3"
      || report.passed !== true || report.checks.length !== 4
      || report.checks.some((check, i) => check.parameter_count !== counts[i]
        || check.parameter_errors.length !== counts[i]
        || check.parameter_errors.some(error => !finite(error.max_abs_error))
        || !finite(check.output_max_abs_error) || !finite(check.embedding_output_max_abs_error)
        || check.gradient_layouts !== true
        || check.checkpoint.parameter_count !== counts[i]
        || check.checkpoint.captured_revision !== 2 || check.checkpoint.restored_updates !== 2
        || check.checkpoint.final_revision !== 6 || check.checkpoint.large_revision !== "9007199254740994"
        || !["exact_logits_loss", "exact_parameter_gradients", "exact_parameters", "immutable_capture",
          "foreign_tape", "foreign_gradients", "rejected_update_resume", "nonzero_update_control"]
          .every(key => check.checkpoint[key] === true)
        || check.bias_errors.length !== biasCounts[i] || !check.bias_errors.every(finite)
        || check.causality.suffix_gradient_zero !== true || check.causality.sensitivity_control !== true
        || !finite(check.causality.prefix_max_abs_error)
        || !finite(check.causality.other_document_max_abs_error)
        || !finite(check.causality.extension_max_abs_error)
        || Object.keys(check.tapes).length !== 9 || Object.values(check.tapes).some(v => v !== true)
        || (i >= 2 && (check.metric_controls.relative_checker_negative_controls !== 3
          || check.metric_controls.off_output_separation <= 1e-6
          || check.metric_controls.detached_embedding_gradient_separation <= 1e-8
          || check.metric_controls.qk_scores_zero !== (i === 2)
          || !finite(check.metric_controls.output_contrast_relative_l2) || check.metric_controls.output_contrast_relative_l2 > 0.002
          || !finite(check.metric_controls.pullback_contrast_relative_l2) || check.metric_controls.pullback_contrast_relative_l2 > 0.002
          || check.parameter_errors.filter(e => e.name.startsWith("geometry.")).some(e => !finite(e.relative_l2_error) || e.relative_l2_error > 0.002)))
        || check.learning.steps !== 16 || check.learning.trace.length !== 16
        || check.learning.trace.some((step, j) => step.revision !== j + 1
          || !finite(step.loss) || !finite(step.parameter_max_abs_error)
          || step.geometry_gradient_relative_l2.length !== (i < 2 ? 0 : i === 2 ? 5 : 6)
          || step.geometry_gradient_relative_l2.some(v => !finite(v) || v > 0.002)))) {
    throw Error("Incomplete byte decoder verification");
  }
  result.textContent = JSON.stringify(report, null, 2);
  result.dataset.status = "passed";
  document.querySelector("#summary").textContent = "Passed: four complete byte models, all 18/31/23/37 parameter VJPs and 16 Torch-reference updates each. JSON checkpoint/resume matches uninterrupted logits, gradients and weights exactly within this browser run, including rejection recovery and revisions above 2^53. Synthetic correctness only, not language quality or speed.";
  const download = document.querySelector("#download");
  download.href = URL.createObjectURL(new Blob([result.textContent], {type:"application/json"}));
  download.download = "resident-byte-decoder.json";
  download.hidden = false;
} catch (error) {
  result.textContent = JSON.stringify({passed:false, error:String(error.stack || error)});
  result.dataset.status = "error";
  document.querySelector("#summary").textContent = "Verification failed. See the diagnostic below.";
}
</script>
