<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Frozen geometry parameter learning</title>
<h1>Frozen geometry parameter learning</h1>
<p id="summary">Running Rust/WebGPU checks...</p>
<a id="download" hidden>Download parameter-rate result</a>
<pre id="result" data-status="running"></pre>
<script type="module">
const result = document.querySelector("#result");
try {
  const {default: init, run_resident_byte_parameter_rates} = await import("/target/resident-byte-decoder-web/resident_byte_decoder_browser.js");
  await init();
  const raw = await run_resident_byte_parameter_rates();
  const report = JSON.parse(raw);
  if (report.schema !== "spiraltorch.resident_byte_parameter_rates.validation.v1"
      || report.passed !== true || report.checks.length !== 2
      || report.checks.some((c, i) => c.parameter_count !== [23, 37][i]
        || c.frozen_parameter_bits !== true || c.embedding_parameters_learn !== true
        || c.invalid_rates_preserve_tape !== true || c.trace.length !== 16
        || c.trace.some((s, j) => s.revision !== j + 1 || !Number.isFinite(s.loss)))) {
    throw Error("Incomplete parameter-rate verification");
  }
  result.textContent = JSON.stringify({passed:true, cases:report.checks.map(c => ({
    name:c.name, parameters:c.parameter_count, updates:c.trace.length,
    frozen_parameter_bits:c.frozen_parameter_bits, embedding_parameters_learn:c.embedding_parameters_learn
  }))}, null, 2);
  result.dataset.status = "passed";
  document.querySelector("#summary").textContent = "Passed Rust controls: geometry weights stay bitwise frozen; embeddings still learn. Download the raw report for all-step independent PyTorch comparison. Not a quality or speed result.";
  const download = document.querySelector("#download");
  // Preserve the Rust numeric serialization, including signed zero.
  download.href = URL.createObjectURL(new Blob([raw], {type:"application/json"}));
  download.download = "resident-byte-parameter-rates.json";
  download.hidden = false;
} catch (error) {
  result.textContent = String(error.stack || error);
  result.dataset.status = "error";
  document.querySelector("#summary").textContent = "Verification failed.";
}
</script>
