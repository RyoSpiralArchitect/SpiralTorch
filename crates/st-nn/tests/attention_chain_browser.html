<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident Projection and Z-RBF Attention Chain</title>
<pre id="result" data-status="running">Checking resident projection/attention chain...</pre>
<script type="module">
import init, {run_attention_chain_projection} from "../../../target/attention-chain-web/resident_attention_chain_browser.js";
const result = document.querySelector("#result");
try {
  await init();
  const params = new URLSearchParams(location.search);
  const benchmark = params.get("suite") === "benchmark";
  const projection = params.get("projection") || "scalar";
  let fixture;
  if (benchmark) {
    const response = await fetch("../../../target/attention-chain-web/benchmark-fixture.json");
    if (!response.ok) throw Error("Generate and place benchmark-fixture.json in target/attention-chain-web first");
    fixture = await response.text();
  }
  const report = JSON.parse(await run_attention_chain_projection(projection, fixture));
  if (report.schema !== "spiraltorch.attention_chain.v1" || !report.passed ||
      report.projection !== projection ||
      report.checks.length !== (benchmark ? 18 : 12) ||
      report.output_paths?.join(",") !== "default_head_merge,direct_merged_heads" ||
      report.checks.some(c => !Number.isFinite(c.merged_heads_max_abs_error)) ||
      report.geometry_checks.length !== (benchmark ? 3 : 2)) throw Error("Incomplete chain fixture");
  result.textContent = JSON.stringify(report, null, 2);
  result.dataset.status = "passed";
} catch (error) {
  result.textContent = JSON.stringify({passed: false, error: String(error.stack || error)});
  result.dataset.status = "error";
}
</script>
