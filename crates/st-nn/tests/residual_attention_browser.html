<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident residual attention training</title>
<h1>Resident residual attention training</h1>
<p id="summary">Running the frozen Rust/WebGPU checks...</p>
<a id="download" hidden>Download training verification</a>
<pre id="result" data-status="running">Checking residual attention training...</pre>
<script type="module">
const result = document.querySelector("#result");
try {
  const {default: init, run_residual_attention_checks} = await import("/target/residual-attention-web/resident_residual_attention_browser.js");
  await init();
  const report = JSON.parse(await run_residual_attention_checks());
  if (report.passed !== true || report.checks.length !== 60 || report.training.length !== 2
      || Object.keys(report.guards).length !== 12 || Object.values(report.guards).some(v => v !== true)
      || report.checks.some(check => ![12,13].includes(check.max_abs_error.parameters.length))
      || report.training.some(check => check.updates.length !== 32
        || check.final_parameter_errors.length !== (check.topos ? 13 : 12)
        || check.rejected_update_preserves_all_parameters !== true || check.recovery !== true)) {
    throw Error("Incomplete residual attention verification");
  }
  result.textContent = JSON.stringify(report, null, 2);
  result.dataset.status = "passed";
  document.querySelector("#summary").textContent = "Passed: 60 forward/VJP cases, 32 plain + 32 Topos updates, 12 guard checks. Correctness only, not a speed or language-quality benchmark.";
  const download = document.querySelector("#download");
  download.href = URL.createObjectURL(new Blob([result.textContent], {type:"application/json"}));
  download.download = "resident-residual-attention.json";
  download.hidden = false;
} catch (error) {
  result.textContent = JSON.stringify({passed:false, error:String(error.stack || error)});
  result.dataset.status = "error";
  document.querySelector("#summary").textContent = "Verification failed. See the diagnostic below.";
}
</script>
