[package]
authors = ["Ryo ∴ SpiralArchitect <kishkavsesvit@icloud.com>"]
name = "st-nn"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "High-level nn.Module-style API for SpiralTorch"

[lib]
name = "st_nn"
path = "src/lib.rs"

[features]
default = ["selfsup"]
psi = ["st-core/psi"]
psychoid = ["st-core/psychoid"]
collapse = ["psi", "st-core/collapse"]
golden = ["st-core/golden"]
kdsl = ["st-core/kdsl"]
wgpu = ["st-core/wgpu-rt", "st-tensor/wgpu", "dep:st-backend-wgpu", "dep:bytemuck"]
cuda = ["st-core/cuda", "st-tensor/cuda"]
hip = ["st-core/hip", "st-tensor/hip"]
selfsup = []

[dependencies]
st-kernel-contracts = { path = "../st-kernel-contracts" }
st-backend-wgpu = { path = "../st-backend-wgpu", optional = true }
bytemuck = { version = "1.25", optional = true }
st-tensor = { path = "../st-tensor", default-features = false, features = ["cpu"] }
st-core = { path = "../st-core", default-features = false }
st-frac = { path = "../st-frac" }
st-text = { path = "../st-text" }
spiral-config = { path = "../spiral-config" }
futures = "0.3"
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"
num-complex = "0.4"
nalgebra = "0.32"

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
pollster = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Preserve native Faer acceleration without importing its threadpool into WASM.
st-tensor = { path = "../st-tensor", default-features = false, features = ["cpu", "faer"] }

[package.metadata.spiraltorch]
copyright = "© 2025 Ryo ∴ SpiralArchitect — All rights reserved"

