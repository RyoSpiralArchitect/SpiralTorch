[package]
name = "st-vision"
version = "0.1.0"
edition = "2021"
authors = ["Ryo ∴ SpiralArchitect <kishkavsesvit@icloud.com>"]
description = "Z-space native vision utilities for SpiralTorch"
license = "AGPL-3.0-or-later"

[features]
default = ["nn"]
wgpu = ["dep:st-backend-wgpu", "dep:wgpu", "st-tensor/wgpu", "st-nn?/wgpu"]
nerf = ["nn"]
nn = ["dep:st-nn", "dep:serde", "dep:serde_json"]

[dependencies]
st-core = { path = "../st-core", default-features = false }
st-tensor = { path = "../st-tensor", default-features = false, features = ["cpu"] }
st-logic = { path = "../st-logic" }
st-nn = { path = "../st-nn", optional = true }
spiral-config = { path = "../spiral-config" }
rand = "0.8"
st-backend-wgpu = { path = "../st-backend-wgpu", optional = true }
wgpu = { version = "0.20", features = ["wgsl"], optional = true }
st-frac = { path = "../st-frac" }
ndarray = "0.15"
ordered-float = "4.2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Keep native Faer acceleration without pulling its threadpool into WASM.
st-tensor = { path = "../st-tensor", default-features = false, features = ["cpu", "faer"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[package.metadata.spiraltorch]
copyright = "© 2025 Ryo ∴ SpiralArchitect — All rights reserved"

[[example]]
name = "convnext_image_classification"
required-features = ["nn"]

[[example]]
name = "depthwise_conv2d_bench"
required-features = ["nn", "wgpu"]

[[example]]
name = "convnext_resident_block"
required-features = ["nn", "wgpu"]

[[example]]
name = "convnext_resident_backbone"
required-features = ["nn", "wgpu"]

[[example]]
name = "convnext_resident_bench"
required-features = ["nn", "wgpu"]

[[example]]
name = "depthwise_resident_vjp_bench"
required-features = ["nn", "wgpu"]

[[example]]
name = "convnext_block_vjp_browser"
crate-type = ["cdylib"]
required-features = ["nn", "wgpu"]

[[example]]
name = "convnext_backbone_vjp_browser"
crate-type = ["cdylib"]
required-features = ["nn", "wgpu"]

[[example]]
name = "convnext_resident_learning_browser"
crate-type = ["cdylib"]
required-features = ["nn", "wgpu"]

[[example]]
