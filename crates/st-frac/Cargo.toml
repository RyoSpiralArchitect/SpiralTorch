
[package]
authors = ["Ryo ∴ SpiralArchitect <kishkavsesvit@icloud.com>"]
name = "st-frac"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "SpiralTorch fractional calculus (Grünwald–Letnikov) operators for tensors."

[features]
default = []
wgpu = ["dep:wgpu", "dep:bytemuck", "dep:st-backend-wgpu"]

[dependencies]
ndarray = "0.15"
thiserror = "1"
num-complex = "0.4"
libm = "0.2"
rand = "0.8"
bytemuck = { version = "1", optional = true, features = ["derive"] }
wgpu = { version = "0.20", optional = true, features = ["wgsl"] }
st-backend-wgpu = { path = "../st-backend-wgpu", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
approx = "0.5"

[package.metadata.spiraltorch]
copyright = "© 2025 Ryo ∴ SpiralArchitect — All rights reserved"
