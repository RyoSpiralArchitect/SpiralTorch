[package]
name = "st-backend-wgpu"
version = "0.1.0"
edition = "2021"
authors = ["Ryo ∴ SpiralArchitect <kishkavsesvit@icloud.com>"]
license = "AGPL-3.0-or-later"
description = "WGPU backend kernels and pipeline loaders for SpiralTorch"

[dependencies]
wgpu = { version = "0.20", features = ["wgsl"] }
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
st-kernel-contracts = { path = "../st-kernel-contracts" }
pollster = "0.3"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"

[dev-dependencies]
naga = { version = "0.20", default-features = false, features = ["wgsl-in"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[[example]]
name = "resident_nerf_browser"
crate-type = ["cdylib"]

[[example]]
name = "resident_nerf_bench_browser"
crate-type = ["cdylib"]

[[example]]
name = "softmax_portable_bench_browser"
crate-type = ["cdylib"]

[[example]]
name = "consensus_readback_bench_browser"
crate-type = ["cdylib"]

[[example]]
name = "gelu_backward_bench_browser"
crate-type = ["cdylib"]

[[example]]
name = "layer_norm_resident_browser"
crate-type = ["cdylib"]

