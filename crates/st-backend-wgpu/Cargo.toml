[package]
name = "st-backend-wgpu"
version = "0.1.0"
edition = "2021"
authors = ["Ryo ∴ SpiralArchitect <kishkavsesvit@icloud.com>"]
license = "AGPL-3.0-or-later"
description = "WGPU backend kernels and pipeline loaders for SpiralTorch"

[dependencies]
wgpu = { version = "0.20", features = ["wgsl"] }
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
st-kernel-contracts = { path = "../st-kernel-contracts" }
pollster = "0.3"

[dev-dependencies]
naga = { version = "0.20", default-features = false, features = ["wgsl-in"] }

[package.metadata.spiraltorch]
copyright = "© 2025 Ryo ∴ SpiralArchitect — All rights reserved"
