<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Poincare metric bias</title>
<h1>Poincare metric bias</h1>
<p id="summary">Running Rust/WebGPU metric checks...</p>
<a id="download" hidden>Download verification result</a>
<pre id="result" data-status="running">Checking forward and both endpoint VJPs...</pre>
<script type="module">
const result = document.querySelector("#result");
try {
  const {default: init, run_poincare_bias_checks} = await import("/target/poincare-bias-web/poincare_bias_browser.js");
  await init();
  const report = JSON.parse(await run_poincare_bias_checks());
  const finite = x => Number.isFinite(x) && x >= 0;
  if (report.schema !== "spiraltorch.poincare_bias.validation.v1" || report.passed !== true
      || report.checks.length !== 8
      || report.checks.some(c => c.strided !== true || c.shapes !== true
        || ![c.score_max_abs, c.coordinates_vjp_max_abs, c.gain_vjp_max_abs, c.cpu_max_abs].every(finite))
      || report.analytic.near_boundary !== true || report.analytic.large_v !== true
      || report.analytic.extended_cases.length !== 7
      || report.analytic.extended_cases.some(c => c.nonzero !== true || !finite(c.relative_error) || c.relative_error > 8e-5)
      || report.guards.prefix_invariant !== true || report.guards.future_gradient_zero !== true
      || report.guards.suffix_sensitive !== true || report.guards.guarded_operands !== 3
      || report.guards.outside_ball_rejections !== 2 || report.guards.retained !== true
      || report.guards.good_bad_good !== true || report.guards.late_gradient_whole_family !== true
      || report.guards.atomic_rejections !== 2 || report.guards.rejection_negative_controls !== 4
      || JSON.stringify(report.pair_scales.shape) !== "[2,17,32]" || report.pair_scales.heads !== 8
      || report.pair_scales.distinct_seeds !== 2 || report.pair_scales.retained_results !== true
      || report.pair_scales.repeat_bitwise_equal !== true || !finite(report.pair_scales.cpu_vjp_max_abs)) throw Error("Incomplete metric validation");
  result.textContent = JSON.stringify(report, null, 2);
  result.dataset.status = "passed";
  document.querySelector("#summary").textContent = "Passed: eight PyTorch cases, both endpoint/gain VJPs, near-boundary and extended-range controls, causality and failure isolation. Metric primitive only, not full-model learning, language quality or throughput.";
  const link = document.querySelector("#download");
  link.href = URL.createObjectURL(new Blob([result.textContent], {type: "application/json"}));
  link.download = "poincare-bias.json";
  link.hidden = false;
} catch (error) {
  result.textContent = JSON.stringify({passed: false, error: String(error.stack || error)});
  result.dataset.status = "error";
  document.querySelector("#summary").textContent = "Verification failed. See diagnostics.";
}
</script>
