<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident attention training public WASM API</title>
<pre id="result" data-status="running">Checking public projection training...</pre>
<a id="download" hidden>Download public training verification</a>
<script type="module">
const result = document.querySelector("#result");
try {
  const moduleUrl = new URL(new URLSearchParams(location.search).get("module") || "./module/spiraltorch_wasm.js", location.href);
  if (moduleUrl.origin !== location.origin) throw Error("Module must be served from this origin");
  const st = await import(moduleUrl.href);
  await st.default();
  const response = await fetch("../../../crates/st-nn/tests/fixtures/resident_attention_training_torch.json");
  if (!response.ok) throw Error("Fixture fetch: " + response.status);
  const fixture = await response.json();
  const assert = (condition, label) => { if (!condition) throw Error(label); };
  assert(fixture.schema === "spiraltorch.resident_attention_training_torch.v1" &&
         fixture.cases.length === 30 && fixture.training.losses.length === 16, "Fixture contract");
  function projectionPlans(c) {
    assert(c.projections.length === 4, "Projection count");
    return c.projections.map(p => st.InferencePlan.fromJson(JSON.stringify({
      schema:"spiraltorch.nn.inference_plan.v1",
      input_shape:[...c.input_shape.slice(0,2), p.weight_shape[0]],
      stages:[{inner:p.weight_shape[0], cols:p.weight_shape[1],
               weight:p.weight, bias:p.bias, gelu:false}]
    })));
  }
  function makePlan(c) {
    const ps = projectionPlans(c);
    try {
      return st.AttentionInferencePlan.fromProjectionPlans(...ps, c.heads, c.causal ? 0 : undefined);
    } finally { ps.forEach(p => p.free()); }
  }
  async function compile(c) {
    const plan = makePlan(c);
    const compiling = plan.compileTrainingWebGpu();
    plan.free(); // Must remain safe before asynchronous compilation completes.
    return await compiling;
  }
  function upload(device, shape, values) {
    return device.upload(Array.from(shape), new Float32Array(values));
  }
  function biases(device, c) {
    const result = new st.WgpuAttentionBiases();
    const [b,t] = c.input_shape;
    for (const [name, shape, setter] of [
      ["z_bias", [b,c.heads,t], "setZBias"],
      ["pair_bias", [b,c.heads,t,t], "setPairBias"],
    ]) {
      if (c[name] !== null) {
        const tensor = upload(device, shape, c[name]);
        result[setter](tensor);
        tensor.free();
      }
    }
    return result;
  }
  async function read(tensor) {
    const snapshot = tensor.snapshot();
    try { return Array.from(await snapshot.readValues()); }
    finally { snapshot.free(); }
  }
  async function check(tensor, expected) {
    const actual = await read(tensor);
    assert(actual.length === expected.length, "Tensor length");
    let maximum = 0;
    for (let i=0; i<actual.length; i++) {
      const error = Math.abs(actual[i]-expected[i]);
      assert(Number.isFinite(actual[i]) && Number.isFinite(expected[i]) &&
             error <= 3e-6 + 5e-5*Math.abs(expected[i]), "Numerical mismatch at " + i);
      maximum = Math.max(maximum, error);
    }
    return maximum;
  }
  async function checkParameters(tensors, expected) {
    assert(tensors.length === 4 && expected.length === 4, "Parameter count");
    let maximum = 0;
    for (let i=0; i<4; i++) maximum = Math.max(maximum, await check(tensors[i], expected[i]));
    return maximum;
  }
  async function reject(call, pattern, label) {
    try { await call(); }
    catch (error) {
      assert(pattern.test(String(error)), label + ": wrong error: " + String(error));
      return;
    }
    throw Error(label + ": missing rejection");
  }
  const guards = [];
  const ps = projectionPlans(fixture.cases[0]);
  for (const invalid of [true, -1, 0.5, "2", 2**33]) {
    await reject(() => st.AttentionInferencePlan.fromProjectionPlans(...ps, invalid), /heads|integer|number/, "strict heads");
    await reject(() => st.AttentionInferencePlan.fromProjectionPlans(...ps, 2, invalid), /causal_offset|integer|number/, "strict offset");
  }
  for (let index=0; index<4; index++) {
    for (const field of ["gelu", "input_shape"]) {
      const p = JSON.parse(ps[index].toJson());
      if (field === "gelu") p.stages[0].gelu = true;
      else p.input_shape.splice(0,2,1,6);
      const changed = st.InferencePlan.fromJson(JSON.stringify(p));
      const inputs = ps.slice(); inputs[index] = changed;
      await reject(() => st.AttentionInferencePlan.fromProjectionPlans(...inputs, 2),
                   field === "gelu" ? /each projection plan must contain exactly one unfused Linear/
                     : /linear parameter or input dimensions differ at stage [0-3]/,
                   "projection boundary");
      changed.free();
    }
  }
  ps.forEach(p => p.free());
  guards.push("strict_integers", "all_four_projection_boundaries", "compile_after_free");
  let adapter;
  const checks = [];
  for (const c of fixture.cases) {
    const model = await compile(c), device = model.tensorDevice();
    adapter = device.adapterInfo();
    assert(adapter.device_type !== "Cpu", "CPU fallback not accepted");
    assert(JSON.stringify(Array.from(model.inputShape)) === JSON.stringify(c.input_shape), "Input shape");
    const x = upload(device, model.inputShape, c.input), u = upload(device, model.outputShape, c.upstream);
    const bs = biases(device, c), forward = model.forward(x, bs);
    assert(forward.parameterRevision === 0n, "Initial revision");
    const gradients = model.backward(forward, u);
    const output = forward.predictionTensor(), dx = gradients.inputGradientTensor();
    const dp = gradients.parameterGradientTensors();
    const dz = gradients.zBiasGradientTensor(), db = gradients.pairBiasGradientTensor();
    gradients.free(); forward.free(); x.free(); u.free(); bs.free(); device.free(); model.free();
    const errors = {forward:await check(output, c.expected), input:await check(dx, c.input_gradient),
                    parameters:await checkParameters(dp, c.parameter_gradients)};
    for (const [tensor,key] of [[dz,"z_bias_gradient"], [db,"pair_bias_gradient"]]) {
      if (c[key] === null) assert(tensor === undefined, "Unexpected bias gradient");
      else { errors[key] = await check(tensor, c[key]); tensor.free(); }
    }
    output.free(); dx.free(); dp.forEach(t => t.free());
    checks.push({name:c.name, max_abs_error:errors});
  }
  guards.push("retained_tensors_after_owner_free");
  const c = fixture.training, source = makePlan(c), model = await source.compileTrainingWebGpu();
  const device = model.tensorDevice(), x = upload(device, model.inputShape, c.input);
  const target = upload(device, model.outputShape, c.target), bs = biases(device, c), lossFn = new st.MeanSquaredError();
  const initial = model.parameterTensors(), initialValues = [];
  for (const t of initial) initialValues.push(await read(t));
  const losses = [];
  for (let index=0; index<c.losses.length; index++) {
    const forward = model.forward(x, bs), prediction = forward.predictionTensor();
    const loss = lossFn.evaluateResident(prediction, target), scalar = loss.lossTensor(), seed = loss.predictionGradientTensor();
    const error = await check(scalar, [c.losses[index]]);
    losses.push({pre_update_mse:(await read(scalar))[0], max_abs_error:error});
    const gradients = model.backward(forward, seed), update = model.sgd(gradients, c.rate);
    assert(update.attemptedRevision === BigInt(index+1), "Attempted revision");
    const accepted = update.read(); update.free();
    assert(await accepted === BigInt(index+1), "Accepted revision");
    forward.free(); prediction.free(); loss.free(); scalar.free(); seed.free(); gradients.free();
  }
  assert(model.attemptedUpdates === 16n, "Update count");
  const parameters = model.parameterTensors();
  const finalParameterError = await checkParameters(parameters, c.final_parameters);
  parameters.forEach(t => t.free());
  const finalForward = model.forward(x, bs), finalOutput = finalForward.predictionTensor();
  const finalOutputError = await check(finalOutput, c.final_prediction);
  finalForward.free(); finalOutput.free();
  const fresh = await source.compileTrainingWebGpu(); source.free();
  const freshParameters = fresh.parameterTensors();
  for (let i=0; i<4; i++) {
    assert(JSON.stringify(await read(initial[i])) === JSON.stringify(initialValues[i]), "Snapshot mutated");
    assert(JSON.stringify(await read(freshParameters[i])) === JSON.stringify(initialValues[i]), "Source mutated");
    initial[i].free(); freshParameters[i].free();
  }
  guards.push("immutable_source_and_snapshots", "receipt_after_free");
  model.free(); lossFn.free(); target.free();
  const foreign = await compile(c);
  const forward = fresh.forward(x, bs), foreignForward = foreign.forward(x, bs);
  foreignForward.free();
  const seed = upload(device, fresh.outputShape, c.upstream);
  await reject(() => foreign.backward(forward, seed), /latest forward/, "foreign forward");
  const good = fresh.backward(forward, seed), oppositeSeed = upload(device, fresh.outputShape, c.upstream.map(v => -v));
  const opposite = fresh.backward(forward, oppositeSeed), goodTensors = good.parameterGradientTensors();
  const oppositeTensors = opposite.parameterGradientTensors();
  await checkParameters(goodTensors, c.parameter_gradients);
  await checkParameters(oppositeTensors, c.parameter_gradients.map(a => a.map(v => -v)));
  goodTensors.forEach(t => t.free()); oppositeTensors.forEach(t => t.free());
  opposite.free(); oppositeSeed.free();
  await reject(() => foreign.sgd(good, c.rate), /owner's current version/, "foreign gradients");
  for (const rate of [-1, NaN, Infinity]) await reject(() => fresh.sgd(good, rate), /finite and nonnegative/, "invalid rate");
  const huge = upload(device, fresh.outputShape, c.upstream.map(() => 3e38)), invalid = huge.mul(huge);
  const bad = fresh.backward(forward, invalid), update = fresh.sgd(bad, c.rate);
  assert(update.attemptedRevision === 1n, "Rejected attempt revision");
  await reject(() => update.read(), /non-finite training value.*no parameters were committed/, "rejected update");
  const unchanged = fresh.parameterTensors();
  for (let i=0; i<4; i++) {
    assert(JSON.stringify(await read(unchanged[i])) === JSON.stringify(initialValues[i]), "Partial update");
    unchanged[i].free();
  }
  await reject(() => fresh.sgd(good, c.rate), /owner's current version/, "stale gradients");
  await reject(() => fresh.backward(forward, seed), /latest forward/, "stale forward");
  const current = fresh.forward(x, bs), recoveryGradients = fresh.backward(current, seed);
  const recovery = fresh.sgd(recoveryGradients, 0), retained = current.predictionTensor();
  for (const handle of [foreign, fresh, device, x, bs, seed, huge, invalid, bad, good, forward, current, update, recoveryGradients]) handle.free();
  assert(await recovery.read() === 2n, "Recovery receipt after owner free");
  await check(retained, c.expected); recovery.free(); retained.free();
  guards.push("repeated_cotangents", "foreign_owner", "strict_rate", "all_or_none_nonfinite",
              "stale_version", "recovery_after_rejection");
  const report = {schema:"spiraltorch.resident_attention.training_clients.v1", passed:true,
    adapter, module_path:moduleUrl.pathname, checks, losses, final_parameter_error:finalParameterError,
    final_output_error:finalOutputError, guards};
  result.textContent = JSON.stringify(report, null, 2); result.dataset.status = "passed";
  const download = document.querySelector("#download");
  download.href = URL.createObjectURL(new Blob([result.textContent], {type:"application/json"}));
  download.download = "resident-attention-training-public-clients.json"; download.hidden = false;
} catch (error) {
  result.textContent = JSON.stringify({passed:false,error:String(error.stack || error)});
  result.dataset.status = "error";
}
</script>
