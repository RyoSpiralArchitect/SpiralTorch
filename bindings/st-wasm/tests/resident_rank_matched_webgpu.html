<!doctype html>
<meta charset="utf-8">
<title>Matched resident MidK WebGPU controls</title>
<pre id="result" data-status="running">running</pre>
<script type="module">
import initCandidate, {WgpuRank as Candidate} from "/module/spiraltorch_wasm.js";
import initBaseline, {WgpuRank as Baseline} from "/baseline/spiraltorch_wasm.js";

const out=document.querySelector("#result");
const report={schema:"spiraltorch.browser_rank_matched.v1",status:"running",cases:[],
  boundary:"64 resident pairs plus completion fence; alternating arms; validation outside timing",
  interpretation:"one deterministic fixture; separate devices in one browser; adapter identity may be anonymous",
  repetitions:64,warmup_batches:4,retained_batches:16};
const suite=new URLSearchParams(location.search).get("suite");
const pruning=suite==="pruning",pairLanes=suite==="pair-lanes",prefix=suite==="prefix",countBounds=suite==="count-bounds";
report.fixture_suite=countBounds ? "count-bounds" : prefix ? "prefix" : pairLanes ? "pair-lanes" : pruning ? "pruning" : "boundary";
if(pruning || pairLanes || prefix || countBounds) report.interpretation="three deterministic seeds including quantized ties; separate devices in one browser; adapter identity may be anonymous";
function assert(ok, message) { if(!ok) throw Error(message); }
function reference(input,rows,cols,k,kind) {
  const values=[],indices=[];
  for(let row=0;row<rows;row++) {
    const order=Array.from({length:cols},(_,i)=>i).filter(i=>Number.isFinite(input[row*cols+i]));
    order.sort((i,j)=>{
      const a=input[row*cols+i],b=input[row*cols+j];
      const cmp=a===0 && b===0 && !Object.is(a,b) ? (Object.is(a,-0) ? -1 : 1) : a-b;
      return (kind==="topk" ? -cmp : cmp) || i-j;
    });
    const take=Math.min(k,order.length),start=kind==="midk" ? Math.floor((order.length-take)/2) : 0;
    for(const i of order.slice(start,start+take)) { values.push(input[row*cols+i]); indices.push(i); }
    while(values.length<(row+1)*k) { values.push(NaN); indices.push(-1); }
  }
  return {values,indices};
}
function requests() {
  if(prefix) return [17,29,43].flatMap(seed=>[
    ...["topk","bottomk"].flatMap(kind=>[
      ...[[2,8193,512],[64,8193,512],[2,8193,256]].flatMap(([rows,cols,tile_cols])=>
        [7,63,64,65,256,257].map(k=>({kind,rows,cols,k,tile_cols,seed}))),
      {kind,rows:2,cols:1024,k:65,tile_cols:1024,seed},
    ]),
    {kind:"midk",rows:2,cols:8193,k:65,tile_cols:512,seed},
  ]);
  if(pairLanes || countBounds) return [17,29,43].flatMap(seed=>["topk","midk","bottomk"].flatMap(kind=>[
    ...[[2,1023,32],[2,4095,128],[2,8191,256],[2,8193,512],
     [64,8191,256],[64,8193,512],[2,8193,1024],[2,8193,2048]].map(([rows,cols,tile_cols])=>
      ({kind,rows,cols,k:65,tile_cols,seed})),
    ...(countBounds ? [0,1,7,511,512].map(finite_per_tile=>
      ({kind,rows:2,cols:1025,k:65,tile_cols:512,seed,finite_per_tile})) : []),
  ]));
  if(!pruning) return [32,33,63,64,65,127,128,129,255,256,257].flatMap(tiles=>
    [1,7,65,256].map(k=>({kind:"midk",rows:2,cols:tiles*32-1,k,tile_cols:32})));
  return [17,29,43].flatMap(seed=>[
    ...[[2,1023,32],[2,4095,128],[2,8191,256],[2,8193,512],
        [2,16383,512],[64,8191,256],[2,8193,256]].flatMap(([rows,cols,tile_cols])=>
      [7,65].map(k=>({kind:"midk",rows,cols,k,tile_cols,seed}))),
    ...[7,1024].map(k=>({kind:"midk",rows:2,cols:1024,k,tile_cols:1024,seed})),
    ...["topk","bottomk"].map(kind=>({kind,rows:2,cols:8191,k:65,tile_cols:256,seed})),
  ]);
}
function fixture(rows,cols,seed) {
  let state=seed;
  return Float32Array.from({length:rows*cols},(_,i)=>{
    state=(Math.imul(state,1664525)+1013904223)>>>0;
    if(i%251===0) return NaN;
    if(i%127===0) return -0;
    return seed===undefined ? (i*73%127-63)/8 :
      seed===43 ? (state%127-63)/8 : state/4294967296*2-1;
  });
}
function check(actual,expected) {
  assert(actual.values instanceof Float32Array && actual.indices instanceof Int32Array,"typed readback");
  assert(actual.values.length===expected.values.length && actual.indices.length===expected.indices.length,"readback length");
  for(let i=0;i<expected.values.length;i++) {
    assert(Object.is(actual.values[i],expected.values[i]),"value mismatch "+i);
    assert(actual.indices[i]===expected.indices[i],"source index mismatch "+i);
  }
}
try {
  await initBaseline();
  await initCandidate();
  let caseIndex=0;
  for(const request of requests()) {
    const {kind,rows,cols,k,tile_cols:tile,seed}=request;
    const input=fixture(rows,cols,seed);
    if(request.finite_per_tile!==undefined) {
      for(let row=0;row<rows;row++) for(let col=0;col<cols;col++) {
        const offset=col%tile,length=Math.min(tile,cols-(col-offset));
        const finite=(offset+seed)%length<Math.min(request.finite_per_tile,length);
        const index=row*cols+col;
        input[index]=finite ? (Number.isFinite(input[index]) ? input[index] : -0) : NaN;
      }
    }
    const expected=reference(input,rows,cols,k,kind);
    const baseline=await Baseline.create(kind,rows,cols,k,tile);
    const candidate=await Candidate.create(kind,rows,cols,k,tile);
    try {
      if(!report.adapters) report.adapters={baseline:baseline.adapterInfo(),candidate:candidate.adapterInfo()};
      baseline.upload(input); candidate.upload(input);
      const samples=[];
      for(let batch=0;batch<report.warmup_batches+report.retained_batches;batch++) {
        const order=(caseIndex+batch)%2===0 ? ["baseline","candidate"] : ["candidate","baseline"];
        const sample={order};
        for(const arm of order) {
          const ws=arm==="baseline" ? baseline : candidate;
          await ws.synchronize();
          const began=performance.now();
          ws.dispatch(report.repetitions);
          await ws.synchronize();
          sample[arm+"_ms"]=(performance.now()-began)/report.repetitions;
          check(await ws.readback(),expected);
        }
        if(batch>=report.warmup_batches) samples.push(sample);
      }
      report.cases.push({...request,samples,status:"passed"});
    } finally { baseline.free(); candidate.free(); }
    caseIndex++;
  }
  report.status="passed";
} catch(error) { report.status="error"; report.error=String(error.stack||error); }
out.textContent=JSON.stringify(report,null,2); out.dataset.status=report.status;
</script>
