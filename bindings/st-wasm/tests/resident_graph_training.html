<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Rust resident graph training</title>
<pre id="result" data-status="running">Checking graph-owned gains and transactional SGD</pre>
<script type="module">
import init, {run_resident_graph_training_fixture} from "./module/spiraltorch_wasm.js";
const result = document.querySelector("#result");
try {
  if (!navigator.gpu) throw Error("WebGPU unavailable; no CPU fallback");
  await init();
  const report = JSON.parse(await run_resident_graph_training_fixture());
  if (report.status !== "passed" || report.cases?.length !== 6 || report.guards?.length !== 36 || report.primitive_checks?.length !== 3)
    throw Error("Incomplete graph training fixture");
  const masked=report.guards.filter(g=>g.case==="masked_forward_overflow");
  const expected=new Set();
  for(let stage=0;stage<8;stage++) for(const policy of ["Exact","ModuleCompatible"])
    for(const rate of [0,Math.fround(.01)]) expected.add(JSON.stringify([stage,policy,rate]));
  for(const guard of masked) {
    if(!guard.all_parameter_bits_unchanged||!guard.retained_guard_after_reuse_and_drop||
       !expected.delete(JSON.stringify([guard.fault_stage,guard.policy,Math.fround(guard.rate)])))
      throw Error("Invalid or repeated masked-overflow guard");
  }
  if(masked.length!==32||expected.size) throw Error("Missing masked-overflow guard");
  if(report.pointwise_fusion?.cases?.length!==6||report.pointwise_fusion?.guards?.length!==16)
    throw Error("Missing fused forward/VJP/rollback comparisons");
  if(report.autograd?.cases?.length!==6||report.autograd?.guards?.length!==12||
      report.autograd.cases.some(c=>c.replays.length!==4)||report.autograd.guards.some(g=>g.passed!==true))
    throw Error("Missing arbitrary-cotangent VJP and recovery checks");
  const capture = report.autograd.guards.filter(g=>g.case==="queued_capture_tail_shapes_detached_guard_recovery");
  if(report.resident_loss?.status!=="passed"||report.resident_loss?.cases?.length!==6||
      report.resident_loss?.probes?.length!==7||report.resident_loss.cases.some(c=>
        c.observations_after_updates!==64||c.module_parameters_applied!==7||c.steps.length!==64))
    throw Error("Missing ordinary Loss to resident VJP/SGD and module handoff");
  if(report.classification?.status!=="passed"||report.classification?.cases?.length!==6||
      report.classification?.probes?.length!==43||report.classification.cases.some(c=>
        c.observations_after_updates!==64||c.module_parameters_applied!==7||c.steps.length!==64))
    throw Error("Missing class-last CrossEntropy learning and numerical probes");
  if(report.microbatch?.status!=="passed"||report.microbatch?.cases?.length!==6||report.microbatch.cases.some(c=>
      c.observations_after_updates!==32||c.microbatches!==95||c.windows.length!==32||c.module_parameters_applied!==7))
    throw Error("Missing cross-input microbatch accumulation and module handoff");
  if(capture.length!==1||capture[0].captured_vjps!==4||capture[0].observation!=="after_workspace_drop"||
      JSON.stringify(capture[0].input_shape)!=="[2,3,257]")
    throw Error("Missing detached VJP capture and shared-guard recovery checks");
  result.textContent = JSON.stringify(report);
  result.dataset.status = "passed";
} catch (error) {
  result.textContent = JSON.stringify({status:"error",error:String(error.stack || error)});
  result.dataset.status = "error";
}
</script>
