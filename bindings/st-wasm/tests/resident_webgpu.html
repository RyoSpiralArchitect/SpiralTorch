<!doctype html>
<meta charset="utf-8">
<title>SpiralTorch resident WebGPU validation</title>
<h1>Resident WebGPU validation</h1>
<pre id="result" data-status="running">Running</pre>
<script type="module">
const output = document.querySelector("#result");
const report = {
  schema: "spiraltorch.browser_resident_matmul.v4",
  boundary: "resident dispatch then four-byte map completion fence; upload/allocation/full readback excluded",
  dtype: "float32", user_agent: navigator.userAgent, cases: [], assertions: [],
};
function stage(name) {
  report.stage=name;
  output.textContent=JSON.stringify(report,null,2);
}
function assert(ok, message) {
  if (!ok) throw new Error(message);
  report.assertions.push(message);
}
async function rejects(fn, message) {
  let rejected = false;
  try { await fn(); } catch (_) { rejected = true; }
  assert(rejected, message);
}
function fixture(n, seed) {
  let state = seed >>> 0;
  return Float32Array.from({length:n}, () => {
    state ^= state << 13; state ^= state >>> 17; state ^= state << 5;
    return (state >>> 0) / 4294967296 - 0.5;
  });
}
function reference(a, b, m, k, n) {
  const out = new Float64Array(m*n);
  for (let row=0; row<m; row++) for(let col=0; col<n; col++) {
    let sum=0;
    for(let i=0;i<k;i++) sum += a[row*k+i]*b[i*n+col];
    out[row*n+col]=sum;
  }
  return out;
}
function check(actual, expected) {
  if (actual.length !== expected.length) throw new Error("output length mismatch");
  let max = 0;
  for(let i=0;i<actual.length;i++) {
    const error = Math.abs(actual[i]-expected[i]);
    if(!Number.isFinite(actual[i]) || error > 1e-5+1e-4*Math.abs(expected[i])) {
      throw new Error(`element ${i}: ${actual[i]} != ${expected[i]}`);
    }
    max=Math.max(max,error);
  }
  return max;
}
function summary(samples) {
  const ordered = [...samples].sort((a,b)=>a-b), i=Math.floor(ordered.length/2);
  return {samples_ms:samples, median_ms:(ordered[i-1]+ordered[i])/2,
    p95_ms:ordered[Math.ceil(ordered.length*.95)-1]};
}
try {
  stage("module import");
  const {default:init, WgpuMatmul} = await import("/module/spiraltorch_wasm.js");
  stage("initialize WASM");
  await init();
  const tileSpec = new URL(location.href).searchParams.get("tiles") ?? "8,8,16";
  const tiles = tileSpec.split(";").map(part => part.split(",").map(Number));
  if(tiles.some(tile=>tile.length!==3 || tile.some(x=>!Number.isInteger(x))) ||
      new Set(tiles.map(tile=>tile.join("x"))).size!==tiles.length) throw Error("invalid tile list");
  report.tiles_mnk=tiles;
  const kernels = (new URL(location.href).searchParams.get("kernels") ?? "auto").split(";");
  if(kernels.some(k=>!["auto","scalar","register_2x2"].includes(k)) || new Set(kernels).size!==kernels.length) throw Error("invalid kernel list");
  report.kernels_requested=kernels;
  const accumulations=(new URL(location.href).searchParams.get("accumulations") ?? "sequential").split(";");
  if(accumulations.some(a=>!["sequential","tiled","compensated"].includes(a)) || new Set(accumulations).size!==accumulations.length) throw Error("invalid accumulation list");
  if(kernels.includes("auto") && accumulations.some(a=>a!=="sequential")) throw Error("non-default accumulation benchmark requires an explicit kernel");
  report.accumulations_requested=accumulations;
  const shapes=(new URL(location.href).searchParams.get("shapes") ?? "7,63,65;64,64,64;256,256,256;512,512,512;1024,64,32")
    .split(";").map(shape=>shape.split(",").map(Number));
  if(shapes.some(shape=>shape.length!==3 || shape.some(x=>!Number.isSafeInteger(x)||x<1)) || new Set(shapes.map(shape=>shape.join(","))).size!==shapes.length) throw Error("invalid shape list");
  report.shapes_m_k_n=shapes;
  stage("invalid dimensions");
  for(const dim of [-1,0,1.5,NaN,Infinity,4294967296,"2",true]) {
    await rejects(()=>WgpuMatmul.create(dim,2,2), "reject invalid dimension "+String(dim));
  }
  for(const tile of [[0,8,16],[-1,8,16],[8,1.5,16],[32,32,16],[8,8,65],[8,"8",16]]) {
    await rejects(()=>WgpuMatmul.createWithTile(2,3,2,...tile), "reject invalid tile "+tile.join(","));
  }
  for(const kernel of ["unknown","auto",true,0,null,{},new String("scalar")]) {
    await rejects(()=>WgpuMatmul.createWithKernel(2,3,2,16,16,16,kernel), "reject invalid kernel "+String(kernel));
  }
  await rejects(()=>WgpuMatmul.createWithKernel(2,3,2,3,5,7,"register_2x2"), "reject odd blocked tile");
  for(const accumulation of ["unknown","auto",true,0,null,{},new String("compensated")]) {
    await rejects(()=>WgpuMatmul.createWithOptions(2,3,2,16,16,16,"scalar",accumulation), "reject invalid accumulation "+String(accumulation));
  }
  const adapter = await navigator.gpu?.requestAdapter();
  if(!adapter) throw new Error("No browser WebGPU adapter; no CPU fallback");
  report.browser_adapter = {
    vendor:adapter.info?.vendor, architecture:adapter.info?.architecture,
    device:adapter.info?.device, description:adapter.info?.description,
    is_fallback_adapter:adapter.info?.isFallbackAdapter ?? adapter.isFallbackAdapter,
  };
  report.adapter_identity_boundary = "Browser adapter probe is separate from the Rust runtime; wgpu 0.20 reports no exact browser adapter identity";
  report.browser_limits = {maxBufferSize:adapter.limits.maxBufferSize,
    maxStorageBufferBindingSize:adapter.limits.maxStorageBufferBindingSize};
  stage("create Rust workspace");
  const [probe, concurrent] = await Promise.all([
    WgpuMatmul.create(2,3,2), WgpuMatmul.createWithOptions(2,2,1,16,16,32,"register_2x2","tiled"),
  ]);
  assert(Array.from(probe.tileMNK()).join(",")==="8,8,16", "default tile remains stable");
  assert(probe.kernel === "scalar" && Array.from(probe.workgroupSize()).join(",")==="8,8,1", "small default keeps scalar geometry");
  assert(probe.accumulation === "sequential", "default accumulation remains sequential");
  assert(concurrent.kernel === "register_2x2" && Array.from(concurrent.outputsPerThread()).join(",")==="2,2", "explicit blocked workspace reports actual geometry");
  assert(concurrent.accumulation === "tiled", "GPU chain permits distinct accumulation policies");
  for(const kernel of ["scalar", "register_2x2"]) {
    const stable=await WgpuMatmul.createWithOptions(3,3075,5,16,16,16,kernel,"compensated");
    assert(stable.accumulation === "compensated", "actual accumulation matches request");
    const a=new Float32Array(3*3075), b=new Float32Array(3075*5).fill(1);
    for(let i=0;i<a.length;i++) a[i]=[1e8,1,-1e8][i%3];
    stable.upload(a,b); stable.dispatch();
    assert(Array.from(await stable.readback()).every(x=>x===1025), "compensated cancellation "+kernel);
    stable.free();
  }
  report.rust_adapter = probe.adapterInfo();
  if(report.rust_adapter instanceof Map) report.rust_adapter = Object.fromEntries(report.rust_adapter);
  await rejects(()=>probe.dispatch(), "missing input rejected");
  await rejects(()=>probe.readback(), "uncomputed output rejected");
  const a = new Float32Array([1,2,3,4,5,6]);
  const b = new Float32Array([1,0,0,1,1,1]);
  for(const bad of [Array.from(a),new Float64Array(a),new Uint32Array(a),{}]) {
    await rejects(()=>probe.upload(bad,b), "reject non-Float32Array operand");
  }
  const frame = document.createElement("iframe");
  document.body.append(frame);
  const foreign = new frame.contentWindow.Float32Array(a);
  probe.upload(foreign,b);
  probe.dispatch();
  const generation = probe.generation;
  await rejects(()=>probe.upload(a,b.subarray(1)), "invalid upload rejected atomically");
  assert(probe.generation === generation && probe.outputIsCurrent, "invalid upload preserves generation/output");
  for(const count of [-1,0,1.5,1025,4294967296,NaN,"1"]) {
    await rejects(()=>probe.dispatch(count), "reject invalid repetition "+String(count));
  }
  stage("overlapping snapshots");
  const before = probe.readback();
  probe.upload(new Float32Array(6),b);
  await rejects(()=>probe.readback(), "updated input invalidates output");
  probe.dispatch();
  const after = probe.readback();
  check(await after,new Float64Array(4));
  check(await before,new Float64Array([4,5,10,11]));
  assert(true,"overlapping readbacks preserve snapshot generations");
  probe.upload(a,b); probe.dispatch();
  stage("GPU chaining");
  const next = concurrent;
  next.uploadRhs(new Float32Array([1,1]));
  next.setLhsFrom(probe); next.dispatch(3);
  const chained = next.readback();
  next.free(); probe.free(); frame.remove();
  check(await chained,new Float64Array([9,21]));
  assert(true,"GPU chain and pending readback survive workspace free");
  for(const [m,k,n] of shapes) {
    for(const seed of [17,29,43]) {
      stage(`matrix ${m}x${k}x${n}, seed ${seed}`);
      const a=fixture(m*k,seed), b=fixture(k*n,seed+1);
      const expected=reference(a,b,m,k,n), variants=[];
      for(const tile of tiles) for(const kernel of kernels) for(const accumulation of accumulations) {
        const workspace=kernel === "auto" && accumulation === "sequential"
          ? await WgpuMatmul.createWithTile(m,k,n,...tile)
          : await WgpuMatmul.createWithOptions(m,k,n,...tile,kernel,accumulation);
        assert(Array.from(workspace.tileMNK()).join(",")===tile.join(","), "actual tile matches request");
        if(kernel!=="auto") assert(workspace.kernel===kernel,"actual kernel matches request");
        assert(workspace.accumulation===accumulation,"actual accumulation matches request");
        const geometry={kernel_request:kernel,kernel:workspace.kernel,
          accumulation:workspace.accumulation,
          workgroup_size:Array.from(workspace.workgroupSize()),outputs_per_thread:Array.from(workspace.outputsPerThread())};
        workspace.upload(a,b); workspace.dispatch();
        const actual=await workspace.readback();
        let max_abs_error;
        try { max_abs_error=check(actual,expected); }
        catch(error) {
          report.cases.push({shape_m_k_n:[m,k,n],tile_mnk:tile,seed,...geometry,status:"correctness_error",error:String(error)});
          workspace.free();
          continue;
        }
        variants.push({workspace,tile,max_abs_error,geometry,samples:[]});
      }
      const run=async(variant)=> {
        for(let i=0;i<16;i++) variant.workspace.dispatch();
        await variant.workspace.synchronize();
      };
      for(const variant of variants) for(let i=0;i<5;i++) await run(variant);
      let state=seed>>>0;
      const random=()=>{state^=state<<13;state^=state>>>17;state^=state<<5;return(state>>>0)/4294967296;};
      for(let i=0;i<20;i++) {
        const order=[...variants];
        for(let j=order.length-1;j>0;j--) { const k=Math.floor(random()*(j+1)); [order[j],order[k]]=[order[k],order[j]]; }
        for(const variant of order) { const start=performance.now(); await run(variant); variant.samples.push(performance.now()-start); }
      }
      for(const variant of variants) {
        report.cases.push({shape_m_k_n:[m,k,n],tile_mnk:variant.tile,seed,...variant.geometry,
          max_abs_error:variant.max_abs_error,dispatches:16,status:"passed",timing:summary(variant.samples)});
        variant.workspace.free();
      }
    }
  }
  report.status=report.cases.every(x=>x.status==="passed") ? "passed" : "correctness_error";
  report.stage="complete";
} catch(error) {
  report.status="error"; report.error=String(error.stack||error);
}
output.textContent=JSON.stringify(report,null,2);
output.dataset.status=report.status;
</script>
