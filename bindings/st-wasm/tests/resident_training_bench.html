<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident training pass encoding A/B</title>
<pre id="result" data-status="running">Loading isolated benchmark modules</pre>
<script type="module">
import initA, {TrainingBenchmark as A} from "/baseline/spiraltorch_wasm.js";
import initB, {TrainingBenchmark as B} from "/candidate/spiraltorch_wasm.js";
const element=document.querySelector("#result");
const report={schema:"spiraltorch.resident_training_browser_comparison.v1",status:"error",cases:[],
  boundary:"paired rotating Rust WebGPU workloads; all step losses/finite flags captured and read; 2 warmups+8 samples; no cross-framework timing ratio or exact physical-adapter attestation"};
async function progress(value) {
  element.textContent=JSON.stringify(value);
  await globalThis.recordTrainingProgress(value);
}
function require(value,message) { if(!value) throw Error(message); }
function close(a,b) {
  require(a.length===b.length,"length differs");
  let maximum=0;
  a.forEach((x,i)=>{
    require(Number.isFinite(x)&&Number.isFinite(b[i])&&Math.abs(x-b[i])<=1e-5+1e-4*Math.abs(b[i]),"numeric state differs");
    maximum=Math.max(maximum,Math.abs(x-b[i]));
  });
  return maximum;
}
function compare(a,b) {
  let maximum=close([a.loss],[b.loss]);
  for(const key of ["prediction","input_gradient"]) maximum=Math.max(maximum,close(a[key],b[key]));
  for(const key of ["parameters","parameter_gradients"]) {
    require(a[key].length===b[key].length,"stage count differs");
    a[key].forEach((p,i)=>{ for(const name of ["weights","bias"]) maximum=Math.max(maximum,close(p[name],b[key][i][name])); });
  }
  return maximum;
}
try {
  await progress({stage:"initialize_modules"});
  await initA(); await initB();
  const adapter=await navigator.gpu.requestAdapter();
  const info=adapter?.info;
  report.adapter_probe={vendor:info?.vendor??null,architecture:info?.architecture??null,
    description:info?.description??null,isFallbackAdapter:info?.isFallbackAdapter??adapter?.isFallbackAdapter??null,
    boundary:"separate navigator adapter observation; not the Rust workspaces' device receipt"};
  for(const seed of [17,29,43]) for(const [shape,depth] of [[[2,16,32],2],[[4,16,64],8],[[4,32,128],16]]) {
    const config={shape,depth,seed,steps:8};
    await progress({stage:"create_workspaces",config});
    const workers={};
    try {
    workers.baseline=await A.create(JSON.stringify(config));
    workers.candidate=await B.create(JSON.stringify(config));
    const fixtures=Object.fromEntries(Object.entries(workers).map(([k,v])=>[k,JSON.parse(v.fixture())]));
    for(const key of ["config","plan_json","input","target","learning_rate","kernel","accumulation","adapter"])
      require(JSON.stringify(fixtures.baseline[key])===JSON.stringify(fixtures.candidate[key]),"paired fixture differs: "+key);
    const row={config,fixture:fixtures.baseline,candidate_build_manifest:fixtures.candidate.build_manifest,
      captures:{},fingerprints:{},samples:[]};
      for(const cadence of ["immediate","deferred"]) {
        const captures={};
        for(let block=0;block<10;block++) {
          const order=(block+seed)%2===0 ? ["baseline","candidate"] : ["candidate","baseline"];
          const sample={cadence,block,warmup:block<2,order,times_ms:{}};
          row.samples.push(sample);
          for(const lane of order) {
            await progress({stage:"sample_started",config,cadence,block,lane});
            const value=JSON.parse(await workers[lane].sample(JSON.stringify(cadence),!captures[lane]));
            require(value.status==="passed"&&value.steps===8&&value.cadence===cadence&&value.losses.length===8&&
              Number.isFinite(value.elapsed_ms)&&value.elapsed_ms>0,"sample identity/timing differs");
            row.fingerprints[lane]??=value.state_sha256;
            require(row.fingerprints[lane]===value.state_sha256,"reset trajectory is nondeterministic");
            captures[lane]??=value;
            close(value.losses,captures[lane].losses);
            sample.times_ms[lane]=value.elapsed_ms;
            await progress({stage:"sample_finished",config,cadence,block,lane,
              elapsed_ms:value.elapsed_ms,setup_ms:value.setup_ms,state_sha256:value.state_sha256});
          }
        }
        row.captures[cadence+"_baseline"]=captures.baseline;
        row.captures[cadence+"_candidate"]=captures.candidate;
        close(captures.baseline.losses,captures.candidate.losses);
        compare(captures.baseline.state,captures.candidate.state);
      }
      // Transfer completed cases outside timing instead of one enormous final DOM value.
      await globalThis.recordTrainingCase(JSON.stringify(row));
      report.cases.push({config,status:"passed"});
      await progress({stage:"case_finished",config});
    } finally { workers.baseline?.free(); workers.candidate?.free(); }
  }
  report.status="passed";
} catch(error) { report.error=String(error.stack||error); }
element.textContent=JSON.stringify(report);
element.dataset.status=report.status;
</script>
