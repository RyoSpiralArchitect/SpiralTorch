<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident NeRF sampling and compositing</title>
<pre id="result" data-status="running">Checking GPU ray sampling, NN graph and volume integration</pre>
<script type="module">
import init, {run_resident_nerf_fixture} from "./module/spiraltorch_wasm.js";
const result = document.querySelector("#result");
try {
  if (!navigator.gpu) throw Error("WebGPU unavailable; no CPU fallback");
  const adapter = await navigator.gpu.requestAdapter({powerPreference:"high-performance"});
  if (!adapter) throw Error("No browser WebGPU adapter");
  const fallback = adapter.info?.isFallbackAdapter ?? adapter.isFallbackAdapter ?? null;
  if (fallback !== false) throw Error("Non-fallback browser adapter not confirmed");
  await init();
  const report = JSON.parse(await run_resident_nerf_fixture());
  report.browser_adapter_probe = {
    vendor:adapter.info?.vendor ?? null, architecture:adapter.info?.architecture ?? null,
    description:adapter.info?.description ?? null, is_fallback_adapter:fallback,
    boundary:"Separate adapter observation, not attestation of the Rust runtime device"
  };
  if (report.status !== "passed" || report.cases?.length !== 36 ||
      Object.keys(report.guards ?? {}).length !== 5 || !Object.values(report.guards).every(x => x === true))
    throw Error("Incomplete resident NeRF fixture");
  result.textContent = JSON.stringify(report);
  result.dataset.status = "passed";
} catch (error) {
  result.textContent = JSON.stringify({status:"error", error:String(error.stack || error)});
  result.dataset.status = "error";
}
</script>
