<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident parameter updates</title>
<pre id="result" data-status="running">Checking resident parameter updates</pre>
<script type="module">
import init, {run_parameter_checks} from "./module/spiraltorch_wasm.js";
const result = document.querySelector("#result");
try {
  const adapter = await navigator.gpu?.requestAdapter({powerPreference: "high-performance"});
  const fallback = adapter?.info?.isFallbackAdapter ?? adapter?.isFallbackAdapter ?? null;
  if (!adapter || fallback !== false) throw Error("Non-fallback adapter not confirmed");
  await init();
  const report = JSON.parse(await run_parameter_checks());
  const scalarChecks = ["scalar_receipt_one_map", "scalar_offset_view", "scalar_shape_validation",
    "scalar_finite_guard", "scalar_rejection_priority", "retained_scalar_receipt"];
  if (report.schema !== "spiraltorch.resident_parameters.contract.v1" || report.status !== "passed" ||
      report.parameter_checks.length !== 19 || !scalarChecks.every(name => report.parameter_checks.includes(name)) ||
      report.conv2d_steps !== 16 ||
      report.conv2d_training_loop_readbacks !== 0 ||
      !(report.conv2d_final_mse < report.conv2d_initial_mse * 0.1)) {
    throw Error("Incomplete resident parameter checks");
  }
  report.browser_adapter_probe = {vendor: adapter.info?.vendor, architecture: adapter.info?.architecture,
    is_fallback_adapter: fallback, boundary: "Separate probe, not attestation of the Rust runtime device"};
  result.textContent = JSON.stringify(report);
  result.dataset.status = "passed";
} catch (error) {
  result.textContent = JSON.stringify({status: "error", error: String(error.stack || error)});
  result.dataset.status = "error";
}
</script>
