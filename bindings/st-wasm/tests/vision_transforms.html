<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>SpiralTorch Vision CPU/WebGPU parity</title>
<pre id="result" data-status="running">Checking vision transforms</pre>
<script type="module">
import init, {VisionTransformPipeline, Sequential, WgpuTensorDevice} from "./module/spiraltorch_wasm.js";

const result = document.querySelector("#result");
try {
  const adapter = await navigator.gpu?.requestAdapter({powerPreference: "high-performance"});
  const fallback = adapter?.info?.isFallbackAdapter ?? adapter?.isFallbackAdapter ?? null;
  if (!adapter || fallback !== false) throw Error("Non-fallback adapter not confirmed");
  await init();
  const cpu = VisionTransformPipeline.createCpu(17);
  const gpu = await VisionTransformPipeline.createGpu(17);
  if (cpu.backend !== "cpu" || gpu.backend !== "webgpu") throw Error("Wrong execution route");
  const runtimeAdapter = JSON.parse(gpu.adapterInfo);
  if (runtimeAdapter.backend !== "BrowserWebGpu" || runtimeAdapter.device_type === "Cpu") {
    throw Error(`Unexpected Rust runtime adapter: ${gpu.adapterInfo}`);
  }
  for (const pipeline of [cpu, gpu]) {
    pipeline.addResize(8, 10);
    pipeline.addRandomHorizontalFlip(0.5);
    pipeline.addCenterCrop(6, 6);
    pipeline.addRandomHorizontalFlip(0.0);
    pipeline.addRandomHorizontalFlip(1.0);
  }
  let maxAbsError = 0;
  const cases = [];
  for (let frame = 0; frame < 12; frame++) {
    const pixels = Float32Array.from({length: 3 * 12 * 14}, (_, i) => ((i * 37 + frame * 13) % 257) / 256);
    const expected = await cpu.apply(3, 12, 14, pixels);
    const actual = await gpu.apply(3, 12, 14, pixels);
    const shape = Array.from(actual.shape);
    if (JSON.stringify(shape) !== JSON.stringify(Array.from(expected.shape)) || shape.join(",") !== "3,6,6") {
      throw Error(`Shape mismatch at frame ${frame}`);
    }
    const a = actual.values;
    const b = expected.values;
    if (a.length !== b.length) throw Error(`Length mismatch at frame ${frame}`);
    let caseError = 0;
    for (let i = 0; i < a.length; i++) {
      if (!Number.isFinite(a[i])) throw Error(`Non-finite GPU output at frame ${frame}, value ${i}`);
      caseError = Math.max(caseError, Math.abs(a[i] - b[i]));
    }
    maxAbsError = Math.max(maxAbsError, caseError);
    cases.push({frame, shape, max_abs_error: caseError, first_values_cpu: Array.from(b.slice(0, 4)), first_values_gpu: Array.from(a.slice(0, 4))});
  }
  if (maxAbsError > 1e-5) throw Error(`CPU/WebGPU mismatch: ${maxAbsError}`);

  const benchCpu = VisionTransformPipeline.createCpu(23);
  const benchGpu = await VisionTransformPipeline.createGpu(23);
  for (const pipeline of [benchCpu, benchGpu]) {
    pipeline.addResize(80, 96);
    pipeline.addRandomHorizontalFlip(0.5);
    pipeline.addCenterCrop(64, 64);
  }
  const benchPixels = Float32Array.from({length: 3 * 128 * 128}, (_, i) => (i % 257) / 256);
  const cpuMs = [], gpuMs = [];
  let benchMaxAbsError = 0;
  for (let repeat = 0; repeat < 25; repeat++) {
    const measure = async pipeline => {
      const start = performance.now();
      const image = await pipeline.apply(3, 128, 128, benchPixels);
      return {image, elapsed: performance.now() - start};
    };
    let cpuRun, gpuRun;
    if (repeat % 2 === 0) {
      cpuRun = await measure(benchCpu);
      gpuRun = await measure(benchGpu);
    } else {
      gpuRun = await measure(benchGpu);
      cpuRun = await measure(benchCpu);
    }
    const reference = cpuRun.image;
    const candidate = gpuRun.image;
    const a = reference.values, b = candidate.values;
    if (a.length !== b.length) throw Error(`Benchmark output length mismatch at repeat ${repeat}`);
    for (let i = 0; i < a.length; i++) benchMaxAbsError = Math.max(benchMaxAbsError, Math.abs(a[i] - b[i]));
    if (repeat >= 5) { cpuMs.push(cpuRun.elapsed); gpuMs.push(gpuRun.elapsed); }
  }
  if (benchMaxAbsError > 1e-5) throw Error(`Benchmark CPU/WebGPU mismatch: ${benchMaxAbsError}`);
  const median = values => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];

  const retryCpu = VisionTransformPipeline.createCpu(19);
  const retryGpu = await VisionTransformPipeline.createGpu(19);
  const freshCpu = VisionTransformPipeline.createCpu(19);
  for (const pipeline of [retryCpu, retryGpu, freshCpu]) {
    pipeline.addRandomHorizontalFlip(0.5);
    pipeline.addCenterCrop(13, 13);
  }
  let rejectedInvalidCrop = true;
  for (const pipeline of [retryCpu, retryGpu]) {
    try { await pipeline.apply(3, 12, 14, new Float32Array(3 * 12 * 14)); rejectedInvalidCrop = false; }
    catch (error) { rejectedInvalidCrop &&= /center_crop_size/.test(String(error)); }
  }
  if (!rejectedInvalidCrop) throw Error("Invalid crop did not fail before consuming RNG");
  const retryPixels = Float32Array.from({length: 3 * 14 * 14}, (_, i) => ((i * 17 + 3) % 257) / 256);
  const fresh = (await freshCpu.apply(3, 14, 14, retryPixels)).values;
  const retriedCpu = (await retryCpu.apply(3, 14, 14, retryPixels)).values;
  const retriedGpu = (await retryGpu.apply(3, 14, 14, retryPixels)).values;
  let retryCpuError = 0, retryGpuError = 0;
  for (let i = 0; i < fresh.length; i++) {
    retryCpuError = Math.max(retryCpuError, Math.abs(fresh[i] - retriedCpu[i]));
    retryGpuError = Math.max(retryGpuError, Math.abs(fresh[i] - retriedGpu[i]));
  }
  if (retryCpuError !== 0 || retryGpuError > 1e-5) throw Error("Retry changed seeded flip decision");

  const residentCpu = VisionTransformPipeline.createCpu(31);
  const residentGpu = await VisionTransformPipeline.createGpu(31);
  for (const pipeline of [residentCpu, residentGpu]) {
    pipeline.addRandomHorizontalFlip(0.5);
    pipeline.addCenterCrop(6, 6);
  }
  let rejectedResidentCrop = false;
  try { residentGpu.applyResident(1, 5, 7, new Float32Array(35)); }
  catch (error) { rejectedResidentCrop = /center_crop_size/.test(String(error)); }
  if (!rejectedResidentCrop) throw Error("Resident invalid crop did not fail before consuming RNG");
  const residentPixels = Float32Array.from({length: 64}, (_, i) => i / 63);
  const residentExpected = (await residentCpu.apply(1, 8, 8, residentPixels)).values;
  const residentImage = residentGpu.applyResident(1, 8, 8, residentPixels);
  if (Array.from(residentImage.shape).join(",") !== "1,6,6") throw Error("Resident image shape mismatch");
  const flatImage = residentImage.reshape([1, 36]);
  if (!flatImage.sharesStorageWith(residentImage)) throw Error("Reshape lost resident storage");
  const model = new Sequential();
  model.addScaler("vision_gain", new Float32Array(36).fill(2));
  const modelOutput = model.forward(flatImage);
  const modelValues = await modelOutput.snapshot().readValues();
  let residentForwardError = 0;
  for (let i = 0; i < residentExpected.length; i++) {
    residentForwardError = Math.max(residentForwardError, Math.abs(modelValues[i] - residentExpected[i] * 2));
  }
  if (residentForwardError > 1e-5) throw Error(`Resident vision-to-NN forward mismatch: ${residentForwardError}`);
  let rejectedNonfinite = false;
  try { residentGpu.applyResident(1, 8, 8, new Float32Array(64).fill(NaN)); }
  catch (error) { rejectedNonfinite = /non-finite/.test(String(error)); }
  if (!rejectedNonfinite) throw Error("Resident input accepted non-finite values");

  const batchCpu = VisionTransformPipeline.createCpu(271);
  const batchGpu = await VisionTransformPipeline.createGpu(271);
  for (const pipeline of [batchCpu, batchGpu]) {
    pipeline.addResize(8, 10);
    pipeline.addRandomHorizontalFlip(0.5);
    pipeline.addCenterCrop(6, 6);
    pipeline.addRandomHorizontalFlip(0.5);
  }
  const batchCount = 5, batchChannels = 2, batchHeight = 9, batchWidth = 11;
  const imageLength = batchChannels * batchHeight * batchWidth;
  const batchPixels = Float32Array.from({length: batchCount * imageLength}, (_, i) =>
    ((i % imageLength * 31 + Math.floor(i / imageLength) * 17) % 257) / 256);
  let rejectedBatchLength = false;
  try { batchGpu.applyResidentBatch(batchCount, batchChannels, batchHeight, batchWidth, batchPixels.slice(0, -1)); }
  catch (error) { rejectedBatchLength = /length/.test(String(error)); }
  if (!rejectedBatchLength) throw Error("Resident batch accepted a truncated NCHW buffer");
  const expectedBatch = [];
  for (let image = 0; image < batchCount; image++) {
    const sample = batchPixels.slice(image * imageLength, (image + 1) * imageLength);
    expectedBatch.push(...(await batchCpu.apply(batchChannels, batchHeight, batchWidth, sample)).values);
  }
  const residentBatch = batchGpu.applyResidentBatch(batchCount, batchChannels, batchHeight, batchWidth, batchPixels);
  if (Array.from(residentBatch.shape).join(",") !== "5,2,6,6") throw Error("Resident batch shape mismatch");
  const flatBatch = residentBatch.reshape([batchCount, 72]);
  if (!flatBatch.sharesStorageWith(residentBatch)) throw Error("Batch reshape lost resident storage");
  const batchModel = new Sequential();
  batchModel.addScaler("vision_batch_gain", new Float32Array(72).fill(2));
  const batchValues = await batchModel.forwardSnapshot(flatBatch).readValues();
  let batchForwardError = 0;
  for (let i = 0; i < expectedBatch.length; i++) {
    batchForwardError = Math.max(batchForwardError, Math.abs(batchValues[i] - expectedBatch[i] * 2));
  }
  if (batchForwardError > 1e-5) throw Error(`Resident batch-to-NN mismatch: ${batchForwardError}`);
  const depthwiseDevice = residentBatch.device();
  const depthwiseKernel = new Float32Array(18);
  depthwiseKernel[4] = 2;
  depthwiseKernel[13] = -1;
  const depthwiseWeights = depthwiseDevice.upload([2, 3, 3], depthwiseKernel);
  const depthwiseBias = depthwiseDevice.upload([2], new Float32Array([0.1, 0.2]));
  const depthwise = residentBatch.depthwiseConv2d(depthwiseWeights, depthwiseBias, 1, 1, 1, 1, 1, 1).relu();
  if (Array.from(depthwise.shape).join(",") !== "5,2,6,6") throw Error("Resident depthwise shape mismatch");
  const depthwiseValues = await depthwise.snapshot().readValues();
  let depthwiseError = 0;
  for (let i = 0; i < expectedBatch.length; i++) {
    const channel = Math.floor((i % 72) / 36);
    const expected = Math.max(expectedBatch[i] * [2, -1][channel] + [0.1, 0.2][channel], 0);
    depthwiseError = Math.max(depthwiseError, Math.abs(depthwiseValues[i] - expected));
  }
  if (depthwiseError > 1e-5) throw Error(`Resident batch-to-depthwise mismatch: ${depthwiseError}`);
  let rejectedDepthwiseShape = false;
  try { residentBatch.depthwiseConv2d(depthwiseWeights, depthwiseDevice.upload([1], new Float32Array([0])), 1, 1, 1, 1, 1, 1); }
  catch (error) { rejectedDepthwiseShape = /shape/.test(String(error)); }
  if (!rejectedDepthwiseShape) throw Error("Resident depthwise accepted an invalid bias shape");
  const invalidDepthwiseInput = depthwiseDevice.upload([1, 1, 2, 2],
    new Float32Array([0, 0, 0, 3.4028234663852886e38]))
    .mul(depthwiseDevice.upload([], new Float32Array([2])));
  let rejectedInheritedNonfinite = false;
  try {
    await invalidDepthwiseInput.depthwiseConv2d(
      depthwiseDevice.upload([1, 1, 1], new Float32Array([1])),
      depthwiseDevice.upload([1], new Float32Array([0])), 2, 2, 0, 0, 1, 1)
      .snapshot().readValues();
  } catch (error) { rejectedInheritedNonfinite = /non-finite/.test(String(error)); }
  if (!rejectedInheritedNonfinite) throw Error("Resident depthwise lost an upstream validity guard");
  let rejectedBatchNonfinite = false;
  try { batchGpu.applyResidentBatch(1, batchChannels, batchHeight, batchWidth, new Float32Array(imageLength).fill(NaN)); }
  catch (error) { rejectedBatchNonfinite = /non-finite/.test(String(error)); }
  if (!rejectedBatchNonfinite) throw Error("Resident batch accepted non-finite input");

  const trainModel = new Sequential();
  trainModel.addScaler("vision_batch_train_gain", new Float32Array(72).fill(1));
  const trainPlan = trainModel.inferencePlan([batchCount, 72]);
  const learner = await trainPlan.compileGraphLearnerWebGpu("exact");
  learner.setInputTensor(flatBatch);
  const trainDevice = learner.tensorDevice();
  const target = trainDevice.upload([batchCount, 72], Float32Array.from(expectedBatch, value => value * 0.5));
  const negative = trainDevice.upload([], new Float32Array([-1]));
  const mse = values => values.reduce((sum, value, i) => sum + (value - expectedBatch[i] * 0.5) ** 2, 0) / values.length;
  const before = learner.forward();
  const beforePrediction = before.predictionTensor();
  const beforeValues = await beforePrediction.snapshot().readValues();
  const errorTensor = beforePrediction.add(target.mul(negative));
  const gradients = learner.backward(before, errorTensor);
  learner.sgd(gradients, 0.01);
  const update = learner.updateSnapshot();
  await update.read();
  const after = learner.forward();
  const afterValues = await after.predictionTensor().snapshot().readValues();
  const lossBefore = mse(beforeValues), lossAfter = mse(afterValues);
  if (!(lossAfter < lossBefore)) throw Error(`Vision batch training did not reduce MSE: ${lossBefore} -> ${lossAfter}`);

  const roundTrip = await VisionTransformPipeline.createGpu(23);
  const resident = await VisionTransformPipeline.createGpu(23);
  for (const pipeline of [roundTrip, resident]) {
    pipeline.addResize(80, 96);
    pipeline.addRandomHorizontalFlip(0.5);
    pipeline.addCenterCrop(64, 64);
  }
  const tensorDevice = await WgpuTensorDevice.create();
  const gain = new Sequential();
  gain.addScaler("vision_bench_gain", new Float32Array(3 * 64 * 64).fill(1.1));
  const roundTripMs = [], residentMs = [];
  let handoffMaxAbsError = 0;
  const measureRoundTrip = async () => {
    const start = performance.now();
    const image = await roundTrip.apply(3, 128, 128, benchPixels);
    const input = tensorDevice.upload([1, 3 * 64 * 64], image.values);
    const values = await gain.forwardSnapshot(input).readValues();
    return {values, elapsed: performance.now() - start};
  };
  const measureResident = async () => {
    const start = performance.now();
    const image = resident.applyResident(3, 128, 128, benchPixels);
    const values = await gain.forwardSnapshot(image.reshape([1, 3 * 64 * 64])).readValues();
    return {values, elapsed: performance.now() - start};
  };
  for (let repeat = 0; repeat < 25; repeat++) {
    let oldRun, newRun;
    if (repeat % 2 === 0) {
      oldRun = await measureRoundTrip();
      newRun = await measureResident();
    } else {
      newRun = await measureResident();
      oldRun = await measureRoundTrip();
    }
    if (oldRun.values.length !== newRun.values.length) throw Error("Handoff benchmark shape mismatch");
    for (let i = 0; i < oldRun.values.length; i++) {
      handoffMaxAbsError = Math.max(handoffMaxAbsError, Math.abs(oldRun.values[i] - newRun.values[i]));
    }
    if (repeat >= 5) { roundTripMs.push(oldRun.elapsed); residentMs.push(newRun.elapsed); }
  }
  if (handoffMaxAbsError > 1e-5) throw Error(`Handoff benchmark output mismatch: ${handoffMaxAbsError}`);

  const handoffKernel = new Float32Array(3 * 3 * 3);
  for (let channel = 0; channel < 3; channel++) handoffKernel[channel * 9 + 4] = 1.1;
  const handoffWeights = tensorDevice.upload([3, 3, 3], handoffKernel);
  const handoffBias = tensorDevice.upload([3], new Float32Array(3));
  const depthwiseRoundTripMs = [], depthwiseResidentMs = [];
  let depthwiseHandoffError = 0;
  const measureDepthwiseRoundTrip = async () => {
    const start = performance.now();
    const image = await roundTrip.apply(3, 128, 128, benchPixels);
    const input = tensorDevice.upload([1, 3, 64, 64], image.values);
    const values = await input.depthwiseConv2d(handoffWeights, handoffBias, 1, 1, 1, 1, 1, 1)
      .relu().snapshot().readValues();
    return {values, elapsed: performance.now() - start};
  };
  const measureDepthwiseResident = async () => {
    const start = performance.now();
    const image = resident.applyResident(3, 128, 128, benchPixels).reshape([1, 3, 64, 64]);
    const values = await image.depthwiseConv2d(handoffWeights, handoffBias, 1, 1, 1, 1, 1, 1)
      .relu().snapshot().readValues();
    return {values, elapsed: performance.now() - start};
  };
  for (let repeat = 0; repeat < 25; repeat++) {
    let oldRun, newRun;
    if (repeat % 2 === 0) {
      oldRun = await measureDepthwiseRoundTrip();
      newRun = await measureDepthwiseResident();
    } else {
      newRun = await measureDepthwiseResident();
      oldRun = await measureDepthwiseRoundTrip();
    }
    if (oldRun.values.length !== newRun.values.length) throw Error("Depthwise handoff shape mismatch");
    for (let i = 0; i < oldRun.values.length; i++) {
      depthwiseHandoffError = Math.max(depthwiseHandoffError, Math.abs(oldRun.values[i] - newRun.values[i]));
    }
    if (repeat >= 5) {
      depthwiseRoundTripMs.push(oldRun.elapsed);
      depthwiseResidentMs.push(newRun.elapsed);
    }
  }
  if (depthwiseHandoffError > 1e-5) throw Error(`Depthwise handoff mismatch: ${depthwiseHandoffError}`);

  const batchSweep = [];
  for (const [channels, height, width] of [[1, 64, 64], [3, 128, 128]]) {
    const outputHeight = height / 2, outputWidth = width / 2;
    const features = channels * outputHeight * outputWidth;
    for (const count of [1, 4, 16]) {
      const one = await VisionTransformPipeline.createGpu(811);
      const many = await VisionTransformPipeline.createGpu(811);
      for (const pipeline of [one, many]) {
        pipeline.addResize(outputHeight + 8, outputWidth + 8);
        pipeline.addRandomHorizontalFlip(0.5);
        pipeline.addCenterCrop(outputHeight, outputWidth);
      }
      const sampleLength = channels * height * width;
      const pixels = Float32Array.from({length: count * sampleLength}, (_, i) => (i % 251) / 250);
      const perImageScaler = new Sequential();
      const batchScaler = new Sequential();
      for (const model of [perImageScaler, batchScaler]) {
        model.addScaler(`vision_sweep_${channels}_${count}`, new Float32Array(features).fill(1.1));
      }
      const oneMs = [], manyMs = [];
      let maxError = 0;
      const perImage = async () => {
        const start = performance.now();
        const values = [];
        for (let image = 0; image < count; image++) {
          const sample = pixels.subarray(image * sampleLength, (image + 1) * sampleLength);
          const resident = one.applyResident(channels, height, width, sample);
          values.push(...await perImageScaler.forwardSnapshot(resident.reshape([1, features])).readValues());
        }
        return {values, elapsed: performance.now() - start};
      };
      const batched = async () => {
        const start = performance.now();
        const resident = many.applyResidentBatch(count, channels, height, width, pixels);
        const values = await batchScaler.forwardSnapshot(resident.reshape([count, features])).readValues();
        return {values, elapsed: performance.now() - start};
      };
      for (let repeat = 0; repeat < 25; repeat++) {
        let sequential, batch;
        if (repeat % 2 === 0) {
          sequential = await perImage();
          batch = await batched();
        } else {
          batch = await batched();
          sequential = await perImage();
        }
        if (sequential.values.length !== batch.values.length) throw Error("Batch sweep output length mismatch");
        for (let i = 0; i < batch.values.length; i++) {
          maxError = Math.max(maxError, Math.abs(batch.values[i] - sequential.values[i]));
        }
        if (repeat >= 5) { oneMs.push(sequential.elapsed); manyMs.push(batch.elapsed); }
      }
      if (maxError > 1e-5) throw Error(`Batch sweep mismatch at ${channels}x${height}x${width}, N=${count}: ${maxError}`);
      batchSweep.push({input_shape: [count, channels, height, width], output_shape: [count, channels, outputHeight, outputWidth],
        warmups: 5, samples: 20, order: "alternating per-image/batch order per repeat",
        timing: "browser wall time from initial upload to all NN output readbacks",
        per_image_resident_ms: oneMs, batch_resident_ms: manyMs,
        per_image_median_ms: median(oneMs), batch_median_ms: median(manyMs), max_abs_error: maxError});
    }
  }

  result.textContent = JSON.stringify({
    schema: "spiraltorch.vision.transforms.browser.v2",
    status: "passed",
    cases,
    max_abs_error: maxAbsError,
    benchmark: {image_shape: [3, 128, 128], output_shape: [3, 64, 64], warmups: 5,
      samples: 20, order: "alternating CPU/WebGPU order per repeat", timing: "browser wall time including transfer and readback",
      cpu_ms: cpuMs, webgpu_ms: gpuMs, cpu_median_ms: median(cpuMs), webgpu_median_ms: median(gpuMs),
      max_abs_error: benchMaxAbsError},
    rejected_invalid_crop: rejectedInvalidCrop,
    retry_matches_fresh_seed: true,
    retry_max_abs_error: retryGpuError,
    resident_handoff: {model: "Sequential(Scaler x2)", image_shape: [1, 6, 6],
      output_shape: Array.from(modelOutput.shape), terminal_readback_only: true,
      max_abs_error: residentForwardError, rejected_invalid_crop: rejectedResidentCrop,
      rejected_nonfinite_input: rejectedNonfinite},
    resident_batch: {input_shape: [batchCount, batchChannels, batchHeight, batchWidth],
      output_shape: Array.from(residentBatch.shape), model: "Sequential(Scaler x2)",
      terminal_readback_only: true, max_abs_error: batchForwardError,
      rejected_truncated_input: rejectedBatchLength, rejected_nonfinite_input: rejectedBatchNonfinite},
    resident_batch_depthwise: {input_shape: [batchCount, batchChannels, 6, 6],
      output_shape: Array.from(depthwise.shape), kernel_shape: [2, 3, 3],
      terminal_readback_only: true, max_abs_error: depthwiseError,
      rejected_invalid_bias: rejectedDepthwiseShape,
      rejected_inherited_nonfinite: rejectedInheritedNonfinite},
    resident_batch_training: {model: "GraphLearner(Scaler)", input_shape: [batchCount, 72],
      update_rate: 0.01, loss_before: lossBefore, loss_after: lossAfter,
      geometry_to_learner_readback: false, parameter_updates: 1},
    handoff_benchmark: {input_shape: [3, 128, 128], transformed_shape: [3, 64, 64],
      model: "Sequential(Scaler x1.1)", warmups: 5, samples: 20,
      order: "alternating round-trip/resident per repeat",
      timing: "browser wall time including initial upload and final NN output readback",
      round_trip_ms: roundTripMs, resident_ms: residentMs,
      round_trip_median_ms: median(roundTripMs), resident_median_ms: median(residentMs),
      max_abs_error: handoffMaxAbsError},
    depthwise_handoff_benchmark: {input_shape: [3, 128, 128], transformed_shape: [1, 3, 64, 64],
      kernel_shape: [3, 3, 3], warmups: 5, samples: 20,
      order: "alternating round-trip/resident per repeat",
      timing: "browser wall time including initial upload and terminal depthwise output readback",
      round_trip_ms: depthwiseRoundTripMs, resident_ms: depthwiseResidentMs,
      round_trip_median_ms: median(depthwiseRoundTripMs), resident_median_ms: median(depthwiseResidentMs),
      max_abs_error: depthwiseHandoffError},
    batch_sweep: batchSweep,
    rust_runtime_adapter: runtimeAdapter,
    browser_adapter_probe: {vendor: adapter.info?.vendor, architecture: adapter.info?.architecture,
      is_fallback_adapter: fallback, boundary: "Separate probe, not attestation of the Rust runtime device"},
  });
  result.dataset.status = "passed";
} catch (error) {
  result.textContent = JSON.stringify({status: "error", error: String(error.stack || error)});
  result.dataset.status = "error";
}
</script>
