<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident ConvNeXt classifier</title>
<pre id="result" data-status="running">Checking resident classifier learning and resume</pre>
<script type="module">
import init, {run_convnext_classifier_checks} from "./module/spiraltorch_wasm.js";
const result = document.querySelector("#result");
try {
  const adapter = await navigator.gpu?.requestAdapter({powerPreference: "high-performance"});
  const fallback = adapter?.info?.isFallbackAdapter ?? adapter?.isFallbackAdapter ?? null;
  if (!adapter || fallback !== false) throw Error("Non-fallback adapter not confirmed");
  await init();
  const report = JSON.parse(await run_convnext_classifier_checks());
  if (report.schema !== "spiraltorch.convnext_classifier.contract.v1" || report.status !== "passed" ||
      report.checks.length !== 15 || report.steps !== 8 || report.resumed_steps !== 4 ||
      report.parameters !== 24 || report.updated_groups !== 6 || report.training_loop_readbacks !== 0 ||
      report.resume_comparison !== "bitwise" || report.losses.length !== 8 ||
      !(report.final_cross_entropy < report.losses[0]) ||
      !(report.max_scaled_error <= report.scaled_error_tolerance)) {
    throw Error("Incomplete ConvNeXt classifier checks");
  }
  report.browser_adapter_probe = {vendor: adapter.info?.vendor, architecture: adapter.info?.architecture,
    is_fallback_adapter: fallback, boundary: "Separate probe, not attestation of the Rust runtime device"};
  result.textContent = JSON.stringify(report);
  result.dataset.status = "passed";
} catch (error) {
  result.textContent = JSON.stringify({status: "error", error: String(error.stack || error)});
  result.dataset.status = "error";
}
</script>
