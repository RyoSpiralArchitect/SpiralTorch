<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident LayerNorm</title>
<pre id="result" data-status="running">Checking resident LayerNorm</pre>
<script type="module">
import init, {run_layer_norm_checks} from "./module/spiraltorch_wasm.js";
const result = document.querySelector("#result");
try {
  const adapter = await navigator.gpu?.requestAdapter({powerPreference: "high-performance"});
  const fallback = adapter?.info?.isFallbackAdapter ?? adapter?.isFallbackAdapter ?? null;
  if (!adapter || fallback !== false) throw Error("Non-fallback adapter not confirmed");
  await init();
  const report = JSON.parse(await run_layer_norm_checks());
  if (report.schema !== "spiraltorch.resident_layer_norm.browser.v5" || report.status !== "passed" ||
      report.cases !== 7 || report.masks_per_case !== 8 || report.training_steps !== 400 ||
      report.adaptive_workgroup_cases !== 2 || report.adaptive_workgroup_masks !== 3 ||
      report.scale_nullspace_cases !== 5 || report.epsilon_cancellation_cases !== 2 ||
      report.subnormal_cotangent_cases !== 1 ||
      report.dynamic_range_variants !== 20 ||
      report.guard_checks !== 4 || report.intermediate_readbacks !== 0 ||
      report.batched_snapshot_checks !== 4 || report.statistics_only_vjp_checks !== 6) throw Error("Incomplete LayerNorm checks");
  report.browser_adapter_probe = {vendor: adapter.info?.vendor, architecture: adapter.info?.architecture,
    is_fallback_adapter: fallback, boundary: "Separate probe, not attestation of the Rust runtime device"};
  result.textContent = JSON.stringify(report);
  result.dataset.status = "passed";
} catch (error) {
  result.textContent = JSON.stringify({status: "error", error: String(error.stack || error)});
  result.dataset.status = "error";
}
</script>
