<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Resident ConvNeXt learning</title>
<pre id="result" data-status="running">Checking resident ConvNeXt learning</pre>
<script type="module">
import init, {run_convnext_learning_checks} from "./module/spiraltorch_wasm.js";
const result = document.querySelector("#result");
try {
  const adapter = await navigator.gpu?.requestAdapter({powerPreference: "high-performance"});
  const fallback = adapter?.info?.isFallbackAdapter ?? adapter?.isFallbackAdapter ?? null;
  if (!adapter || fallback !== false) throw Error("Non-fallback adapter not confirmed");
  await init();
  const report = JSON.parse(await run_convnext_learning_checks());
  if (report.schema !== "spiraltorch.convnext_learning.contract.v1" || report.status !== "passed" ||
      report.checks.length !== 17 || report.steps !== 8 || report.parameters !== 22 ||
      report.training_loop_readbacks !== 0 || report.updated_parameter_groups !== 5 ||
      report.losses.length !== 8 || !(report.final_mse < report.losses[0]) ||
      !(report.max_scaled_error <= report.scaled_error_tolerance)) {
    throw Error("Incomplete ConvNeXt learning checks");
  }
  report.browser_adapter_probe = {vendor: adapter.info?.vendor, architecture: adapter.info?.architecture,
    is_fallback_adapter: fallback, boundary: "Separate probe, not attestation of the Rust runtime device"};
  result.textContent = JSON.stringify(report);
  result.dataset.status = "passed";
} catch (error) {
  result.textContent = JSON.stringify({status: "error", error: String(error.stack || error)});
  result.dataset.status = "error";
}
</script>
