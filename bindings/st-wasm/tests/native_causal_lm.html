<!doctype html>
<meta charset="utf-8">
<title>Native causal LM: finite-checked geometry learning</title>
<h1>Native causal LM: finite-checked geometry learning</h1>
<p>Four learning controls and six models for cached continuation and terminated answer scoring, using the Rust decoder in WASM host memory. No pretrained model or GPU.</p>
<pre id="result" data-status="running">Running...</pre>
<script type="module">
import {checkNativeCausalLm} from './native_causal_lm.mjs';
import {checkCachedSuffix} from './native_causal_lm_cache.mjs';
import {checkCachedLines} from './native_cached_lines.mjs';
import {checkLineGradients} from './native_line_gradients.mjs';
const result = document.getElementById('result');
try {
  const M = await import('../pkg/spiraltorch_wasm.js');
  await M.default();
  const fixture = await (await fetch('./native_causal_lm_fixture.json')).json();
  const report = checkNativeCausalLm(M, fixture);
  const models = await (await fetch('./native_causal_lm_cache_fixture.json')).json();
  report.cached = checkCachedSuffix(M, models);
  report.line_gradients = checkLineGradients(M, models, await (await fetch('./native_line_gradients_fixture.json')).json());
  report.lines = checkCachedLines(M, models, await (await fetch('./native_cached_lines_fixture.json')).json());
  result.textContent = JSON.stringify(report, null, 2);
  result.dataset.status = 'passed';
} catch (e) {
  result.textContent = String(e?.stack || e);
  result.dataset.status = 'failed';
}
</script>
