[package]
name = "spiraltorch-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Ryo ∴ SpiralArchitect <kishkavsesvit@icloud.com>"]
license = "AGPL-3.0-or-later"
description = "WebAssembly bindings for SpiralTorch fractal canvases and heuristics"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "spiraltorch_wasm"
path = "src/lib.rs"

[features]
webgpu = ["dep:st-backend-wgpu", "dep:wasm-bindgen-futures"]

[dependencies]
st-tensor = { path = "../../crates/st-tensor", default-features = false }
st-core   = { path = "../../crates/st-core" }
st-frac   = { path = "../../crates/st-frac" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ndarray = "0.15"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageData"
] }
serde-wasm-bindgen = "0.5"
getrandom = { version = "0.2", features = ["js"] }
st-backend-wgpu = { path = "../../crates/st-backend-wgpu", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
