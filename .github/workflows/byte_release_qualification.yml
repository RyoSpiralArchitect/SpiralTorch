name: Byte Release GitHub Input Preflight (CPU only)
run-name: Synthetic GitHub reader preflight - ${{ inputs.descriptor_sha256 }}

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: "Exact reviewed preflight controller commit"
        type: string
        required: true
      descriptor_sha256:
        description: "Canonical digest of the committed synthetic descriptor"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: byte-release-github-preflight-20261030
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  read-only-input:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Guard the first synthetic invocation
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/spiralreality/byte-release-github-preflight-20261030
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Fetch only the pinned synthetic ciphertext once
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PREFLIGHT_HEAD: ${{ inputs.expected_head }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ inputs.descriptor_sha256 }}
        run: |
          umask 077
          python -I -S -B tools/byte_release_github_preflight.py run \
            --output "$RUNNER_TEMP/github-input-preflight"
      - name: Retain synthetic-only first-outcome receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-input-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/github-input-preflight/*.json
            ${{ runner.temp }}/github-input-preflight/worker.log
          if-no-files-found: error
          retention-days: 3
