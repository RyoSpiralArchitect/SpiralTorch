name: Verify Official Release Integrity

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to verify (leave empty to verify the latest release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Validate signed release assets
    runs-on: ubuntu-22.04
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sigstore==4.1.*" "requests>=2.32,<3"
          python -m pip check
      - name: Verify official release bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=(--repo "${REPOSITORY}")
          if [ -n "${RELEASE_TAG:-}" ]; then
            ARGS+=(--tag "${RELEASE_TAG}")
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            ARGS+=(--allow-workflow-dispatch-ref refs/heads/main)
          fi
          python scripts/security/verify_release.py "${ARGS[@]}"
