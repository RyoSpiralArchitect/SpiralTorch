name: CI
on:
  push:
    branches: [ main ]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace-inventory:
    name: workspace crate inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test workspace inventory resolver
        run: python3 -m unittest tests/test_list_workspace_crates.py
      - name: Test resident benchmark admission
        run: |
          python3 -I tests/test_resident_rank_bench.py
          python3 -I tests/test_resident_rank_adaptation_bench.py
          python3 -I tests/test_matmul_rank_bench.py
          python3 -I tests/test_resident_training_client_validation.py
          python3 -I tests/test_resident_graph_client_validation.py
          python3 -I tests/test_resident_graph_forward_validation.py
          python3 -I tests/test_graph_forward_paths.py
          python3 -I tests/test_resident_training_bench.py
          python3 -I tests/test_nd_tensor_bench.py
          python3 -I tests/test_pointwise_vjp_bench.py
          python3 -I -B benchmarks/nerf-resident-wgpu/test_compare.py
          python3 -I -B benchmarks/nerf-direct-graph/test_contract.py
          python3 -I -B benchmarks/nerf-single-submit/test_protocol.py
          python3 -I -B benchmarks/nerf-single-submit/test_archive.py
          python3 -I -B benchmarks/nerf-row-input/test_compare.py
          python3 -I -B benchmarks/nerf-row-input/test_evidence.py
          python3 -I -B benchmarks/nerf-pointwise-input/test_compare_pointwise.py
          python3 -I -B benchmarks/nerf-pointwise-input/test_evidence_pointwise.py
          python3 -I -B benchmarks/softmax-portable/test_softmax_protocol.py
          python3 -I -B benchmarks/softmax-portable/test_softmax_evidence.py
          python3 -I -B benchmarks/consensus-readback/test_consensus_protocol.py
          python3 -I -B benchmarks/consensus-readback/test_evidence.py
          python3 -I -B benchmarks/gelu-backward/test_protocol_gelu.py
          python3 -I -B benchmarks/gelu-backward/test_evidence.py
          python3 -I -B benchmarks/layer-norm-resident/test_evidence.py
          python3 -I -B benchmarks/layer-norm-resident/evidence.py verify-public benchmarks/results/2026-09-23-resident-layernorm
          python3 -I -B benchmarks/layer-norm-resident/evidence.py verify-public benchmarks/results/2026-09-23-layernorm-centered-vjp
          python3 -I -B benchmarks/layer-norm-resident/evidence.py verify-public benchmarks/results/2026-09-23-layernorm-expansion-cost
          python3 -I -B benchmarks/gelu-backward/evidence.py verify benchmarks/results/2026-09-23-gelu-backward
          python3 -I -B benchmarks/gelu-backward/evidence.py verify benchmarks/results/2026-09-23-gelu-stable-tail
          python3 -I -B benchmarks/gelu-backward/evidence.py verify benchmarks/results/2026-09-23-gelu-central-tail
          python3 -I -B benchmarks/consensus-readback/evidence.py verify benchmarks/results/2026-09-22-consensus-readback
          python3 -I -B benchmarks/softmax-portable/softmax_evidence.py verify benchmarks/results/2026-09-22-softmax-portable
          python3 -I -B benchmarks/nerf-pointwise-input/evidence_pointwise.py verify benchmarks/results/2026-09-22-nerf-pointwise-input
          python3 -I -B benchmarks/nerf-row-input/evidence.py verify benchmarks/results/2026-09-22-nerf-row-input
          python3 -I -B benchmarks/nerf-single-submit/archive.py verify benchmarks/results/2026-09-21-nerf-single-submit
          python3 -I -B benchmarks/nerf-direct-graph/archive.py verify benchmarks/results/2026-09-21-nerf-direct-graph
          python3 -I -B benchmarks/nerf-resident-wgpu/test_verify.py
          python3 -I -B benchmarks/nerf-resident-wgpu/verify.py benchmarks/results/2026-09-21-nerf-resident-wgpu
      - name: Verify generated workspace inventory
        run: python3 tools/list_workspace_crates.py --check-doc docs/development/workspace_crates.md

  version-consistency:
    name: bindings/st-py version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: pyproject.toml ↔ Cargo.toml version match
        run: bash scripts/check_version_consistency.sh

  build-test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu / stable
            os: ubuntu-latest
            toolchain: stable
            run_lints: false
            run_upper_stack: true
          - name: ubuntu / lint
            os: ubuntu-latest
            toolchain: stable
            run_lints: true
            run_upper_stack: false
          - name: macos / stable
            os: macos-latest
            toolchain: stable
            run_lints: false
            run_upper_stack: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev protobuf-compiler
      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest' && matrix.run_lints
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
          fi
      - name: rustfmt (workspace)
        if: matrix.run_lints
        run: |
          rustup toolchain install nightly-2026-04-15 --profile minimal --component rustfmt
          cargo +nightly-2026-04-15 fmt --all -- --check
      - name: CPU feature isolation
        if: matrix.run_lints
        run: |
          bash scripts/check_cpu_feature_isolation.sh
          cargo test --locked -p st-tensor --no-default-features --features cpu --test prepacked_cpu_dispatch
      - name: Kernel and HIP contract isolation
        if: matrix.run_lints
        env:
          SPIRALTORCH_HIP_TYPECHECK_ONLY: "1"
        run: |
          cargo test --locked -p st-kernel-contracts
          cargo clippy --locked -p st-kernel-contracts --all-targets -- -D warnings
          cargo test --locked -p st-backend-hip --no-default-features
          cargo clippy --locked -p st-backend-hip --no-default-features --features hip-real --all-targets -- -D warnings
          cargo test --locked -p st-tensor --no-default-features --features cpu,faer,hip --lib hip_stub
          cargo test --locked -p st-core --no-default-features --features cpu,hip --lib hip_stub_policy
          cargo check --locked -p st-core --no-default-features --features cpu,hip-real --tests
          cargo check --locked -p spiraltorch-py --no-default-features --features python-default,hip-real
      - name: WGPU backend contract isolation
        if: matrix.run_lints
        run: |
          cargo test --locked -p st-backend-wgpu
          cargo clippy --locked -p st-backend-wgpu --all-targets -- -D warnings
          cargo clippy --locked -p st-frac --all-targets --features wgpu -- -D warnings
          cargo clippy --locked -p st-tensor --all-targets --no-default-features --features cpu,wgpu -- -D warnings
          cargo test --locked -p st-tensor --no-default-features --features cpu,wgpu_frac --test wgpu_feature_ownership
          cargo clippy --locked -p st-core --all-targets --no-default-features --features cpu,wgpu-rt -- -D warnings
      - name: Python text feature isolation
        if: matrix.run_lints
        run: cargo check --locked -p spiraltorch-py --no-default-features --features extension-module,text
      - name: Core metadata observer isolation
        if: matrix.run_lints
        run: bash scripts/check_core_meta_observer_isolation.sh
      - name: st-tensor rustdoc (strict)
        if: matrix.run_lints
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p st-tensor --no-deps
      - name: st-nn rustdoc (strict / psi)
        if: matrix.run_lints
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p st-nn --features psi --no-deps
      - name: clippy (workspace)
        if: matrix.run_lints
        run: cargo clippy --workspace --all-targets
      - name: clippy (strict subset)
        if: matrix.run_lints
        run: bash scripts/run_rust_clippy_strict.sh
      - name: build + test core
        run: |
          cargo test --locked -p st-frac --release --test fft_numerics --test learning --test history_learning --test selective_learning
          cargo test --locked -p st-frac --release --lib learning::tests
          cargo build -p st-core --release
          cargo test  -p st-core --release -- --nocapture
      - name: test upper stack
        if: matrix.run_upper_stack
        run: |
          cargo test -p st-tensor --release --no-default-features --features cpu,faer --lib --test classification --test autograd_observability --test autograd_sgd --test layer_norm_numerics --test layer_norm_autograd --test row_indexing --test wgpu_feature_ownership --test ensemble
          cargo test -p st-nn --release --features golden --lib --test training_gradient_reduction
          cargo build -p st-spiral-rl --release
          cargo build -p st-rec --release
      - name: Cross-crate layout and geometry regressions
        if: matrix.run_upper_stack
        run: |
          cargo test --locked -p st-nn --release --test gelu_layout_contract
          cargo test --locked -p spiral-selfsup --release --test info_nce_tensor
          cargo test --locked -p st-vision --release --test temporal_channels
          cargo test --locked -p st-vision --release --test backbones convnext
          cargo test --locked -p st-vision --release --features nerf --lib --test nerf_geometry --test nerf_regression --test nerf_ray_integral
          cargo test --locked -p st-frac --release --lib fractal_field

  windows-core:
    name: build & test core (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: build + test core
        run: |
          cargo test --locked -p st-frac --release --test fft_numerics --test learning --test history_learning --test selective_learning
          cargo test --locked -p st-frac --release --lib learning::tests
          cargo build -p st-core --release
          cargo test  -p st-core --release -- --nocapture
  wgpu-macos:
    name: st-tensor (wgpu / macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: build tensor + wgpu
        run: cargo build -p st-tensor --features wgpu --release
      - name: Tensor provider feature unification without core WGPU integration
        run: cargo test --locked -p st-core -p st-tensor --release --lib wgpu_observer_preserves_tensor_provider_capability
      - name: Dense WGPU feature ownership and typed Tensor dispatch
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
          SPIRALTORCH_STRICT_GPU: "1"
        run: |
          SPIRALTORCH_EXPECT_NO_WGPU_ALIAS=1 cargo test --locked -p st-tensor --release --test wgpu_feature_ownership --test layer_norm_numerics
          SPIRALTORCH_EXPECT_NO_WGPU_ALIAS=1 cargo test --locked -p st-tensor --no-default-features --features cpu,wgpu_dense --release --test wgpu_feature_ownership
          SPIRALTORCH_EXPECT_NO_WGPU_ALIAS=1 cargo test --locked -p st-tensor --no-default-features --features cpu,wgpu_f16 --release --test wgpu_feature_ownership
          cargo test --locked -p st-tensor --no-default-features --features cpu,wgpu --release --test wgpu_feature_ownership
      - name: Tensor numerical regressions on real WGPU without fallback
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
          SPIRALTORCH_STRICT_GPU: "1"
        run: |
          cargo test --locked -p st-tensor --features wgpu --release --test layer_norm_numerics --test layer_norm_autograd --test row_indexing --test wgpu_matmul_precision --test autograd_prepacked_wgpu
          cargo test --locked -p st-tensor --features wgpu --release --lib matmul
      - name: nonlinear autograd on strict WGPU paths
        env:
          SPIRALTORCH_STRICT_GPU: "1"
        run: cargo test --locked -p st-tensor --features wgpu --release --test autograd_nonlinear
      - name: Resident GPU ownership and matrix/rank chaining
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
        run: |
          cargo test --locked --release -p st-backend-wgpu resident_matmul
          cargo test --locked --release -p st-backend-wgpu rankk_exact_2ce
      - name: Finite-domain softmax on real WGPU without fallback
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
          SPIRALTORCH_STRICT_GPU: "1"
        run: |
          cargo test --locked --release -p st-backend-wgpu softmax -- --test-threads=1
          cargo test --locked --release -p st-backend-wgpu --lib --test readback_batch --example consensus_readback_bench -- --test-threads=1
          cargo test --locked --release -p st-tensor --features wgpu --test wgpu_softmax_extremes
      - name: Live GELU outputs on real WGPU
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
          SPIRALTORCH_STRICT_GPU: "1"
        run: |
          cargo test --locked --release -p st-backend-wgpu --test wgsl_syntax --example gelu_backward_bench -- --test-threads=1
          cargo test --locked --release -p st-tensor --features wgpu --test wgpu_gelu_liveness
      - name: Portable GPU compaction across tile and row-prefix blocks
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
        run: cargo test --locked --release -p st-backend-wgpu midk_bottomk
      - name: Resident NeRF sampling and compositing on a real GPU
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
        run: cargo test --locked --release -p st-backend-wgpu --lib nerf -- --test-threads=1
      - name: Resident NN training and specialized GPU stages
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
        run: |
          cargo test --locked --release -p st-backend-wgpu resident_training -- --test-threads=1
          cargo test --locked --release -p st-backend-wgpu resident_tensor -- --test-threads=1
          cargo test --locked --release -p st-backend-wgpu resident_graph:: -- --test-threads=1
          cargo test --locked --release -p st-nn --no-default-features --features wgpu --test resident_training --test resident_nd_tensor --test resident_graph_training --test resident_graph_forward --test resident_attention_chain -- --test-threads=1
          cargo test --locked --release -p st-nn --features wgpu --lib conv2d_resident_matches_host_and_refreshes_parameters -- --test-threads=1
          cargo test --locked --release -p st-nn --features wgpu --lib conv2d_resident_vjp_matches_module_backward_and_refreshes_parameters -- --test-threads=1
          cargo test --locked --release -p st-nn --features wgpu --lib depthwise_resident_vjp_matches_module_backward_without_host_accumulation -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib resident_geometry_batch_feeds_depthwise_without_intermediate_readback -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib resident_backbone_matches_host_through_stem_stages_and_final_norm -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib resident_block_vjp_matches_host_and_refreshes_changed_parameters -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib resident_backbone_vjp_matches_host_across_stem_downsample_and_final_norm -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib resident_convnext_learning_matches_cpu_and_preserves_ownership -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib resident_convnext_checkpoint_resumes_with_fresh_identity -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib resident_classifier_learning_checkpoint_and_common_entry -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib resident_input::tests -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib input_checkpoint::tests -- --test-threads=1
          cargo test --locked --release -p st-vision --features wgpu --lib resident_trainer::tests -- --test-threads=1
      - name: neural layers and losses with WGPU enabled
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
        run: cargo test --locked -p st-nn --features wgpu --release --lib --test gelu_layout_contract -- --test-threads=1
      - name: InfoNCE entry points with a live dense WGPU probe
        env:
          SPIRALTORCH_RUN_WGPU_RUNTIME_TESTS: "1"
        run: cargo test --locked -p spiral-selfsup --features wgpu --release --test info_nce_tensor -- --test-threads=1

  wasm-build:
    name: spiraltorch-wasm (wasm32 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust WASM contract isolation
        run: |
          cargo clippy --locked -p st-backend-wgpu --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo clippy --locked -p st-frac --target wasm32-unknown-unknown --all-targets --features wgpu -- -D warnings
          cargo clippy --locked -p st-tensor --target wasm32-unknown-unknown --all-targets --no-default-features --features cpu,wgpu -- -D warnings
          cargo clippy --locked -p st-tensor --target wasm32-unknown-unknown --all-targets --no-default-features --features cpu,wgpu_dense -- -D warnings
          cargo clippy --locked -p st-core --target wasm32-unknown-unknown --all-targets --no-default-features --features cpu,wgpu-rt -- -D warnings
          cargo check --locked -p spiraltorch-wasm --target wasm32-unknown-unknown --all-targets
          cargo check --locked -p st-vision --target wasm32-unknown-unknown --features nerf
          cargo check --locked -p st-vision --target wasm32-unknown-unknown --features wgpu --lib
          cargo check --locked -p st-vision --target wasm32-unknown-unknown --features wgpu --example convnext_backbone_vjp_browser
          cargo check --locked -p st-vision --target wasm32-unknown-unknown --features wgpu --example convnext_resident_learning_browser
          cargo check --locked -p st-vision --target wasm32-unknown-unknown --features wgpu --example convnext_resident_checkpoint_browser
          cargo check --locked -p st-vision --target wasm32-unknown-unknown --features wgpu --example convnext_classifier_browser
          cargo check --locked -p st-backend-wgpu --target wasm32-unknown-unknown --example resident_nerf_browser
          cargo check --locked -p st-backend-wgpu --target wasm32-unknown-unknown --example resident_nerf_bench_browser
          cargo check --locked -p st-nn --target wasm32-unknown-unknown --no-default-features --features wgpu --example resident_training_browser
          cargo check --locked -p st-nn --target wasm32-unknown-unknown --no-default-features --features wgpu --example resident_graph_training_browser
          cargo check --locked -p st-nn --target wasm32-unknown-unknown --no-default-features --features wgpu --example resident_graph_forward_browser
          cargo check --locked -p st-nn --target wasm32-unknown-unknown --no-default-features --features wgpu --example resident_nd_tensor_browser
          cargo check --locked -p st-nn --target wasm32-unknown-unknown --no-default-features --features wgpu --example resident_training_bench_browser
      - name: build (wasm32)
        run: cargo build --locked -p spiraltorch-wasm --target wasm32-unknown-unknown --release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Immutable release publication state machine
        run: node --test tests/test_finalize_github_release.cjs
      - name: WASM build profiles sanitize host flags
        run: python3 -S tests/test_build_wasm_web.py
      - name: Install matching WASM JavaScript generator
        run: cargo install wasm-bindgen-cli --version 0.2.104 --locked
      - name: Exercise real WASM bindings and learning loops
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/spiraltorch_wasm.wasm \
            --target nodejs --out-dir "$RUNNER_TEMP/spiraltorch-wasm-node"
          module="$RUNNER_TEMP/spiraltorch-wasm-node/spiraltorch_wasm.js"
          node bindings/st-wasm/tests/numeric_boundaries.cjs "$module"
          node bindings/st-wasm/tests/fft_numerics.cjs "$module"
          node bindings/st-wasm/tests/autograd_sgd.cjs "$module"
          node bindings/st-wasm/tests/autograd_nonlinear.cjs "$module"
          node bindings/st-wasm/tests/gelu_host.cjs "$module"
          node bindings/st-wasm/tests/cpu_dense_matmul.cjs "$module"
          node bindings/st-wasm/tests/autograd_prepacked.cjs "$module"
          node bindings/st-wasm/tests/layer_norm_autograd.cjs "$module"
          node bindings/st-wasm/tests/row_indexing.cjs "$module"
          node bindings/st-wasm/tests/tensor_mean.cjs "$module"
          node bindings/st-wasm/tests/classification.cjs "$module"
          node bindings/st-wasm/tests/rank_adaptation.cjs "$module"
          node bindings/st-wasm/tests/fractional_learning.mjs "$module"
          node bindings/st-wasm/tests/fractional_history.mjs "$module"
          node bindings/st-wasm/tests/fractional_history_l2.mjs "$module"
          node bindings/st-wasm/tests/fractional_history_log_gain.mjs "$module"
          node bindings/st-wasm/tests/fractional_history_window.mjs "$module"
          node bindings/st-wasm/tests/fractional_angle_chart.mjs "$module"
          node bindings/st-wasm/tests/fractional_selective_vjp.mjs "$module"
          node bindings/st-wasm/tests/fractional_tiled_forward.mjs "$module"
          node bindings/st-wasm/tests/elliptic_directional.mjs "$module"
          node bindings/st-wasm/tests/elliptic_chart_step.mjs "$module"
          node tools/probe_topos_capture_wasm.mjs "$RUNNER_TEMP/spiraltorch-wasm-node" \
            "$RUNNER_TEMP/topos-captured-vjp.json" --require-capture
      - name: Portable NN plans without WebGPU
        run: |
          cargo build --locked -p spiraltorch-wasm --target wasm32-unknown-unknown --release --features nn
          wasm-bindgen target/wasm32-unknown-unknown/release/spiraltorch_wasm.wasm \
            --target nodejs --out-dir "$RUNNER_TEMP/spiraltorch-wasm-nn-cpu"
          node bindings/st-wasm/tests/nn_plan.cjs "$RUNNER_TEMP/spiraltorch-wasm-nn-cpu/spiraltorch_wasm.js"
      - name: Browser WebGPU binding build
        run: |
          cargo check --locked -p spiraltorch-wasm --target wasm32-unknown-unknown --features webgpu --lib
          cargo build --locked -p spiraltorch-wasm --target wasm32-unknown-unknown --release --features webgpu
          wasm-bindgen target/wasm32-unknown-unknown/release/spiraltorch_wasm.wasm \
            --target web --out-dir "$RUNNER_TEMP/spiraltorch-wasm-webgpu"
          node bindings/st-wasm/tests/resident_types.cjs "$RUNNER_TEMP/spiraltorch-wasm-webgpu/spiraltorch_wasm.js"
          node bindings/st-wasm/tests/tensor_mean_types.cjs "$RUNNER_TEMP/spiraltorch-wasm-webgpu/spiraltorch_wasm.js"
          wasm-bindgen target/wasm32-unknown-unknown/release/spiraltorch_wasm.wasm \
            --target nodejs --out-dir "$RUNNER_TEMP/vision-input-checkpoint-wasm"
      - name: Share freshly built WASM for native input replay
        uses: actions/upload-artifact@v7
        with:
          name: vision-input-checkpoint-wasm
          path: ${{ runner.temp }}/vision-input-checkpoint-wasm/
          if-no-files-found: error
          retention-days: 1

  vision-input-replay:
    name: vision input checkpoint (Python to WASM)
    needs: [python-docs-smoke, wasm-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          name: vision-input-checkpoint-python
          path: ${{ runner.temp }}/vision-input-checkpoint-python
      - uses: actions/download-artifact@v7
        with:
          name: vision-input-checkpoint-wasm
          path: ${{ runner.temp }}/vision-input-checkpoint-wasm
      - name: Replay the fresh Python checkpoint in real wasm32 Rust
        run: |
          node bindings/st-wasm/tests/vision_input_checkpoint.cjs \
            "$RUNNER_TEMP/vision-input-checkpoint-wasm/spiraltorch_wasm.js" \
            "$RUNNER_TEMP/vision-input-checkpoint-python/vision-input-checkpoint.json"
          node bindings/st-wasm/tests/zspace_feedback_window.cjs \
            "$RUNNER_TEMP/vision-input-checkpoint-wasm/spiraltorch_wasm.js" \
            "$RUNNER_TEMP/vision-input-checkpoint-python/feedback-window.json"
          node bindings/st-wasm/tests/repetition_objective.cjs \
            "$RUNNER_TEMP/vision-input-checkpoint-wasm/spiraltorch_wasm.js" \
            "$RUNNER_TEMP/vision-input-checkpoint-python/repetition-objective.json"

  python-docs-smoke:
    name: python docs smoke (README + hello_session)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: |
          python -m pip install -U pip wheel maturin
          maturin build --release --locked -m bindings/st-py/Cargo.toml --features "logic,kdsl"
      - name: Check embedded Python benchmark API
        run: cargo check --locked -p st-bench --features python --bench python_bindings
      - name: Verify wheel archive
        run: |
          python -P - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          wheels = list(Path("target/wheels").glob("spiraltorch-*.whl"))
          if len(wheels) != 1:
              raise RuntimeError(f"expected exactly one SpiralTorch wheel, found {wheels!r}")

          with ZipFile(wheels[0]) as archive:
              cache_entries = [
                  name
                  for name in archive.namelist()
                  if "__pycache__" in PurePosixPath(name).parts
                  or name.endswith((".pyc", ".pyo"))
              ]
          if cache_entries:
              raise RuntimeError(f"wheel contains Python cache files: {cache_entries!r}")
          print("wheel archive ok")
          PY
      - name: Install wheel
        run: |
          python -m pip install --force-reinstall --no-cache-dir target/wheels/spiraltorch-*.whl
      - name: Resident classifier surface and handoff verifier
        run: |
          python -I -m unittest discover -s bindings/st-py/tests -p test_vision_resident_training.py
          python -I -m unittest discover -s bindings/st-py/tests -p test_vision_trainer_clients.py
          python -I -m unittest discover -s bindings/st-py/tests -p test_vision_trainer_control.py
          python -I -m unittest discover -s bindings/st-py/tests -p test_vision_trainer_feedback.py
          python -I tools/test_vision_classifier_handoff.py
          python -I tools/test_vision_trainer_matched_learning.py
          python -I tools/test_vision_feedback_ablation.py
          python -I tools/test_vision_feedback_stationarity.py
          python -I tools/test_vision_feedback_windows.py
          python -I tools/test_vision_training_timing.py
          python -I tools/test_vision_gpu_profile.py
      - name: Public vision input checkpoint and native replay fixture
        env:
          SPIRALTORCH_INPUT_CHECKPOINT_HANDOFF: ${{ runner.temp }}/vision-input-checkpoint.json
        run: python -I bindings/st-py/tests/test_vision_input_checkpoint.py
      - name: Public Rust feedback window and native replay fixture
        env:
          SPIRALTORCH_FEEDBACK_WINDOW_HANDOFF: ${{ runner.temp }}/feedback-window.json
        run: python -I bindings/st-py/tests/test_zspace_feedback_window.py
      - name: Native repetition objective replay fixture
        run: |
          python -I tools/verify_repetition_objective_clients.py \
            --output-fixture "$RUNNER_TEMP/repetition-objective.json"
      - name: Share fresh Python input checkpoint for WASM replay
        uses: actions/upload-artifact@v7
        with:
          name: vision-input-checkpoint-python
          path: |
            ${{ runner.temp }}/vision-input-checkpoint.json
            ${{ runner.temp }}/feedback-window.json
            ${{ runner.temp }}/repetition-objective.json
          if-no-files-found: error
          retention-days: 1
      - name: Sanity-check packaged stubs
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          python -P - <<'PY'
          import importlib
          import inspect
          import pathlib

          import spiral
          import spiraltorch
          import spiraltorch.spiralk as spiralk

          from spiral import hypergrad_session

          if hypergrad_session.__module__ != "spiral.hypergrad":
              raise RuntimeError("spiral.hypergrad_session is not backed by spiral.hypergrad")

          init_pyi = pathlib.Path(spiraltorch.__file__).resolve().with_name("__init__.pyi")
          py_typed = pathlib.Path(spiraltorch.__file__).resolve().with_name("py.typed")
          spiralk_pyi = pathlib.Path(spiraltorch.__file__).resolve().with_name("spiralk.pyi")

          if not init_pyi.exists():
              raise FileNotFoundError(init_pyi)
          if not py_typed.exists():
              raise FileNotFoundError(py_typed)
          if not spiralk_pyi.exists():
              raise FileNotFoundError(spiralk_pyi)

          stub = init_pyi.read_text(encoding="utf-8")
          for symbol in (
              "HF_TOKENIZED_DATASET_IDENTITY_SCHEMA",
              "hf_tokenized_dataset_identity_report",
              "HF_FINETUNE_TRAINING_RECIPE_IDENTITY_SCHEMA",
              "hf_finetune_training_recipe_identity_report",
              "HF_FINETUNE_REPLAY_IDENTITY_SCHEMA",
              "hf_finetune_replay_identity_report",
          ):
              if symbol not in stub:
                  raise RuntimeError(f"packaged stub is missing {symbol}")

          tokenized = spiraltorch.hf_tokenized_dataset_identity_report(
              train_dataset=[{"input_ids": [1, 2], "labels": [1, 2]}]
          )
          if tokenized.get("status") != "ready":
              raise RuntimeError(f"tokenized dataset identity unavailable: {tokenized!r}")

          recipe = spiraltorch.hf_finetune_training_recipe_identity_report(
              {"learning_rate": 5e-5, "max_steps": 1, "seed": 13},
              model_prepare_report={"mode": "full"},
          )
          if recipe.get("status") != "ready":
              raise RuntimeError(f"training recipe identity unavailable: {recipe!r}")

          def ready_identity(schema, seed, *, field="observed_identity_id"):
              return {
                  "schema": schema,
                  "status": "ready",
                  field: f"sha256:{seed * 64}",
                  "identity_verified": True,
              }

          replay = spiraltorch.hf_finetune_replay_identity_report(
              training_input_identity=ready_identity(
                  "training-input.v1", "1", field="observed_input_id"
              ),
              dataset_input_identity=None,
              dataset_materialization_identity=ready_identity(
                  "materialization.v1", "2"
              ),
              tokenized_dataset_identity=ready_identity("tokenized.v1", "3"),
              model_runtime_identity=ready_identity("runtime.v1", "4"),
              execution_identity=ready_identity("execution.v1", "5"),
              training_recipe_identity=ready_identity("recipe.v1", "6"),
          )
          if replay.get("status") != "ready":
              raise RuntimeError(f"fine-tune replay identity unavailable: {replay!r}")

          submodules = [
              "spiraltorch.psi",
              "spiraltorch.text",
              "spiraltorch.qr",
              "spiraltorch.theory",
              "spiraltorch.julia",
              "spiraltorch.scale_stack",
              "spiraltorch.sot",
              "spiraltorch.rl",
              "spiraltorch.robotics",
          ]
          for name in submodules:
              importlib.import_module(name)

          def assert_reexported(module: str, symbol: str) -> None:
              mod = importlib.import_module(module)
              if hasattr(spiraltorch, symbol) and hasattr(mod, symbol):
                  if getattr(spiraltorch, symbol) is not getattr(mod, symbol):
                      raise RuntimeError(
                          f"{module}.{symbol} is not the same object as spiraltorch.{symbol}"
                      )

          assert_reexported("spiraltorch.psi", "MetaMembConfig")
          assert_reexported("spiraltorch.text", "ContextualPulseFrame")
          assert_reexported("spiraltorch.qr", "QuantumRealityStudio")
          assert_reexported("spiraltorch.theory", "ZRelativityModel")
          assert_reexported("spiraltorch.julia", "ZTigerOptim")
          assert_reexported("spiraltorch.scale_stack", "ScaleStack")
          assert_reexported("spiraltorch.sot", "SoT3DPlan")

          inspect.signature(spiralk.required_blocks)
          print("stubs ok")
          PY
      - name: Run packaged CLI smoke
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          spiral-runtime-preflight --list-presets
          python -P tools/smoke_hf_console_scripts.py
      - name: Run README python blocks
        env:
