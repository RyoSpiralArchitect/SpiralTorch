name: Byte Study Replay Diagnosis
run-name: Retained boundary 20261024 - single authorized attempt

on:
  workflow_dispatch:
    inputs:
      harness_commit:
        description: "Exact reviewed diagnostic branch commit; no publication"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: retained-boundary-20261024-once
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      RESULT_RECIPIENT: age18d8zhwn6nc8lvpf599kqv7emgtdd6lzvzmw6tky6cc2mq62jz36qn5wm54
    steps:
      - name: Admit only the reviewed first attempt
        env:
          EXPECTED_HARNESS: ${{ inputs.harness_commit }}
        run: |
          test "$GITHUB_REPOSITORY" = "RyoSpiralArchitect/SpiralTorch"
          test "$GITHUB_REF" = "refs/heads/spiralreality/retained-hosted-once-20261024"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$EXPECTED_HARNESS" = "$GITHUB_SHA"
          test "${#EXPECTED_HARNESS}" -eq 40
          umask 077
          TRANSPORT_ROOT="$RUNNER_TEMP/retained-20261024"
          EVIDENCE_ROOT="$TRANSPORT_ROOT/evidence"
          printf 'TRANSPORT_ROOT=%s\nEVIDENCE_ROOT=%s\n' "$TRANSPORT_ROOT" "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          mkdir -m 700 "$TRANSPORT_ROOT"
          mkdir -m 700 "$EVIDENCE_ROOT"
          printf 'run_id=%s\nrun_attempt=%s\nharness=%s\nimage_os=%s\nimage_version=%s\nrelease_ready=false\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$ImageOS" "$ImageVersion" \
            > "$EVIDENCE_ROOT/hosted-admission.txt"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Install pinned authenticated-encryption tool
        run: |
          umask 077
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-darwin-arm64.tar.gz \
            --output "$TRANSPORT_ROOT/age.tar.gz"
          printf '%s  %s\n' e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5 \
            "$TRANSPORT_ROOT/age.tar.gz" | shasum -a 256 --check
          tar -xzf "$TRANSPORT_ROOT/age.tar.gz" -C "$TRANSPORT_ROOT"
          test "$("$TRANSPORT_ROOT/age/age" --version)" = "v1.3.2"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: e053c314d54be06b346e30e5ea1a065d7f3fdc90
          path: native-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Test transport and diagnostic supervisor without a GPU
        working-directory: harness
        run: |
          python -I -S -B tools/test_byte_study_retained_transport.py > "$EVIDENCE_ROOT/transport-tests.log" 2>&1
          python -I -S -B tools/test_run_byte_study_retained.py > "$EVIDENCE_ROOT/caller-tests.log" 2>&1
          python -I -S -B tools/test_run_byte_study_boundary.py > "$EVIDENCE_ROOT/boundary-tests.log" 2>&1
          python -I -S -B ../native-source/tools/test_run_byte_study_replay.py > "$EVIDENCE_ROOT/replay-tests.log" 2>&1
      - name: Build and install the pinned private native wheel
        working-directory: native-source
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/retained-target
        run: |
          umask 077
          {
            test "$(git rev-parse HEAD)" = "e053c314d54be06b346e30e5ea1a065d7f3fdc90"
            test -z "$(git status --porcelain)"
            test "$(rustc --version | cut -d ' ' -f 2)" = "1.99.1"
            git rev-parse HEAD 'HEAD^{tree}'
            rustc --version --verbose
            cargo --version --verbose
            python --version
            python -m venv "$TRANSPORT_ROOT/venv"
            "$TRANSPORT_ROOT/venv/bin/python" -m pip install "maturin==1.15.0"
            "$TRANSPORT_ROOT/venv/bin/maturin" build --release --locked \
              --interpreter "$TRANSPORT_ROOT/venv/bin/python" \
              -m bindings/st-py/Cargo.toml --out "$EVIDENCE_ROOT/wheel"
            "$TRANSPORT_ROOT/venv/bin/python" -m pip install --no-index --no-deps \
              --no-cache-dir "$EVIDENCE_ROOT/wheel/"*.whl
            "$TRANSPORT_ROOT/venv/bin/python" -m pip freeze
            shasum -a 256 "$EVIDENCE_ROOT/wheel/"*.whl
            test -z "$(git status --porcelain)"
          } > "$EVIDENCE_ROOT/build.log" 2>&1
      - name: Decrypt and verify the fixed original input
        working-directory: harness
        env:
          INPUT_IDENTITY: ${{ secrets.ST_RETAINED_20261024_INPUT_IDENTITY }}
        run: |
          umask 077
          test -n "$INPUT_IDENTITY"
          input_key="$TRANSPORT_ROOT/input-key.txt"
          trap 'rm -f "$input_key"' EXIT
          printf '%s\n' "$INPUT_IDENTITY" > "$input_key"
          unset INPUT_IDENTITY
          {
            printf '%s  %s\n' a74a3369eb9f9dba60982cda47930db83233cbfd9baf4377675b7773e1a13915 \
              .github/diagnostics/retained-20261024/original-v9.tar.gz.age | shasum -a 256 --check
            "$TRANSPORT_ROOT/age/age" --decrypt --identity "$input_key" \
              --output "$TRANSPORT_ROOT/original-v9.tar.gz" \
              .github/diagnostics/retained-20261024/original-v9.tar.gz.age
            python -I -S -B tools/byte_study_retained_transport.py unpack \
              --input "$TRANSPORT_ROOT/original-v9.tar.gz" --output "$TRANSPORT_ROOT/original"
            python -I -S -B tools/run_byte_study_retained.py \
              --failure-root "$TRANSPORT_ROOT/original"
          } > "$EVIDENCE_ROOT/input-preflight.log" 2>&1
      - name: Execute the fixed retained-boundary diagnostic once
        working-directory: harness
        run: |
          umask 077
          wheels=("$EVIDENCE_ROOT/wheel/"*.whl)
          test "${#wheels[@]}" -eq 1
          set +e
          "$TRANSPORT_ROOT/venv/bin/python" -I -B tools/run_byte_study_retained.py \
            --failure-root "$TRANSPORT_ROOT/original" --source-root ../native-source \
            --wheel "${wheels[0]}" --output "$EVIDENCE_ROOT/diagnostic" \
            --timeout-seconds 7200 --execute-once > "$EVIDENCE_ROOT/launch.log" 2>&1
          code=$?
          printf '%s\n' "$code" > "$EVIDENCE_ROOT/diagnostic-exit.txt"
          exit "$code"
      - name: Seal evidence including partial failures
        if: always()
        working-directory: harness
        run: |
          umask 077
          test -d "$EVIDENCE_ROOT"
          test -x "$TRANSPORT_ROOT/age/age"
          python -I -S -B tools/byte_study_retained_transport.py pack \
            --input "$EVIDENCE_ROOT" --output "$TRANSPORT_ROOT/evidence.tar.gz"
          mkdir -m 700 "$TRANSPORT_ROOT/public"
          "$TRANSPORT_ROOT/age/age" --encrypt --recipient "$RESULT_RECIPIENT" \
            --output "$TRANSPORT_ROOT/public/evidence.tar.gz.age" "$TRANSPORT_ROOT/evidence.tar.gz"
          cd "$TRANSPORT_ROOT/public"
          shasum -a 256 evidence.tar.gz.age > SHA256SUMS
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: retained-encrypted-20261024-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/retained-20261024/public/evidence.tar.gz.age
            ${{ runner.temp }}/retained-20261024/public/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
